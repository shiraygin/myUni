const basics={'Full name':'Zenab Nader Alkhater','University':'Imam Abdulrahman Bin Faisal University','Campus city':'Jubail','Region':'Eastern Province','Country':'Saudi Arabia','Degree':'Bachelor of Science in Computer Science','Field of study':'Computer Science','Attended from':'2021-08-22','Attended to':'2026-06','Overall GPA':'4.06','GPA scale':'5.00','Major GPA':'Not separately reported','Native language':'Arabic','Language of instruction':'English','Research mentor':'Dr. Mohammed Alhamadi'};
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.unis))data={unis:initial,profile:basics,writing:{interest:'Artificial Intelligence, Natural Language Processing, Human–AI Interaction',goals:'',kacst:'',smartreviewer:'',story:'',why:''}};data.profile={...basics,...data.profile};data.writing=data.writing||{};for(const u of data.unis)u.done=u.done||[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let page='home',search='',status='all';
function uniCard(u){return '<div class="card stack"><div class="row"><h3>'+escapeHTML(u.name)+'</h3><span class="pill">'+escapeHTML(u.status)+'</span></div><div class="muted">'+escapeHTML(u.program)+'</div><div><span class="pill">'+escapeHTML(u.track||'Major undecided')+'</span> <span class="pill">'+(u.verified==='yes'?'✓ Date verified':'⚠ Verify dates')+'</span></div><div class="row"><span class="muted small">'+next(u).type+': '+escapeHTML(next(u).date||'Unknown')+'</span><strong>'+countdown(u)+'</strong></div><div class="bar"><span style="width:'+progress(u)+'%"></span></div><div class="row"><span class="muted small">'+u.done.length+'/'+taskNames.length+' complete</span><div class="actions">'+(u.portal?'<a class="btn secondary sm" href="'+escapeHTML(u.portal)+'" rel="noopener" target="_blank">Portal ↗</a>':'')+'<button class="btn sm" data-edit="'+escapeHTML(u.id)+'">Open →</button></div></div></div>'}
function render(){const v=document.getElementById('view');let active=sorted().filter(u=>u.status==='inprogress'),up=sorted().filter(u=>!['closed','submitted','admitted'].includes(u.status)&&next(u).date&&days(next(u).date)>=0);
if(page==='home'){v.innerHTML='<div class="stats"><div class="card">Tracking<strong>'+data.unis.length+'</strong></div><div class="card">In progress<strong>'+active.length+'</strong></div><div class="card">Submitted<strong>'+data.unis.filter(u=>u.status==='submitted').length+'</strong></div><div class="card">Considering<strong>'+data.unis.filter(u=>u.status==='considering').length+'</strong></div></div><div class="hint"><strong>Your next step:</strong> '+(up.length?'Review '+escapeHTML(up[0].name)+' ('+escapeHTML(up[0].program)+'), '+escapeHTML(next(up[0]).type.toLowerCase())+' date '+escapeHTML(next(up[0]).date)+'.':'Set the next deadline.')+' <br><span class="muted small">Tip: choose majors first, then tailor SOPs. Dates labeled unverified are provisional.</span></div><h2 class="section">Next on the calendar</h2><div class="grid">'+up.slice(0,4).map(uniCard).join('')+'</div><h2 class="section">Applications you started</h2><div class="grid">'+active.map(uniCard).join('')+'</div>'}
if(page==='universities'){const items=sorted().filter(u=>(status==='all'||status===u.status)&&(u.name+' '+u.program+' '+u.track).toLowerCase().includes(search.toLowerCase()));v.innerHTML='<div class="filter"><input id="search" placeholder="Find university or major..." value="'+escapeHTML(search)+'"><select id="status"><option value="all">All statuses</option>'+['inprogress','considering','submitted','admitted','closed'].map(s=>'<option '+(status===s?'selected':'')+' value="'+s+'">'+s+'</option>').join('')+'</select></div><div class="grid">'+items.map(uniCard).join('')+'</div>'}
if(page==='deadlines'){v.innerHTML='<div class="hint">🟥 14 days or fewer · 🟨 15–45 days · 🟩 more than 45 days. Unverified dates are provisional and must be checked on the program’s official page. Time zone may differ.</div><div class="stack">'+sorted().map(u=>'<div class="card timeline"><div><strong>'+escapeHTML(next(u).date||'TBD')+'</strong><div class="muted small">'+next(u).type+'</div></div><div><b>'+escapeHTML(u.name)+'</b><div class="muted small">'+escapeHTML(u.program)+(u.verified==='no'?' · ⚠ Unverified':'')+'</div></div><div class="row">'+countdown(u)+' <button class="btn sm" data-edit="'+escapeHTML(u.id)+'">Edit</button></div></div>').join('')+'</div>'}
if(page==='requirements'){v.innerHTML='<div class="hint">Each university has its own checklist. Don’t mark “submitted” until the university portal confirms it. Optional items are only needed if that program requires them.</div><div class="stack">'+sorted().filter(u=>u.status!=='closed').map(u=>'<div class="card"><div class="row"><div><h3>'+escapeHTML(u.name)+'</h3><div class="muted small">'+escapeHTML(u.program)+'</div></div><b>'+progress(u)+'% checked</b></div><div class="bar" style="margin:12px 0"><span style="width:'+progress(u)+'%"></span></div>'+taskNames.map((t,i)=>'<label class="check"><input type="checkbox" data-uid="'+escapeHTML(u.id)+'" data-t="'+i+'" '+(u.done.includes(i)?'checked':'')+'><span>'+escapeHTML(t)+'</span></label>').join('')+'</div>').join('')+'</div>'}
if(page==='profile'){v.innerHTML='<div class="hint">Copy your verified academic details instantly. Edit any value. Do not enter “Not reported” into mandatory numeric fields. No ID numbers or passwords are stored here.</div><div class="card"><div class="row"><h2>Your information</h2><button class="btn sm" id="copyall">Copy all</button></div>'+Object.entries(data.profile).map(([k,x])=>'<div class="copyline"><div><div class="muted small">'+escapeHTML(k)+'</div><strong>'+escapeHTML(x)+'</strong></div><div class="actions"><button class="btn secondary sm" data-copy="'+escapeHTML(k)+'">Copy</button><button class="btn secondary sm" data-key="'+escapeHTML(k)+'">Edit</button></div></div>').join('')+'</div>'}
if(page==='writing'){let fields=[['interest','Research interests — still exploring is okay'],['goals','What do I want from a master’s?'],['kacst','KACST — my specific contribution and what I learned'],['smartreviewer','SmartReviewer — my role, evidence, and technical challenges'],['story','Personal statement — a meaningful experience or community problem'],['why','Why this particular program? (customize per university)']];v.innerHTML='<div class="hint">You do not need a final thesis topic now. Start with broad directions grounded in projects you actually completed. SOP: background → evidence → interests → program fit → goals. Personal statement: authentic experience → reflection → contribution. Adapt every answer to the university prompt.</div><div class="card"><h2>Your writing scratchpad</h2><p class="muted small">Auto-saves on this device as you type.</p>'+fields.map(([k,label])=>'<div style="margin:15px 0"><label>'+escapeHTML(label)+'</label><textarea data-write="'+k+'">'+escapeHTML(data.writing[k]||'')+'</textarea></div>').join('')+'<div class="actions"><button class="btn sm" id="copywriting">Copy notes</button></div></div>'}
if(page==='settings'){v.innerHTML='<div class="grid"><div class="card"><h2>Export backup</h2><p class="muted">Download all your edits as a JSON file. Keep it private and save it somewhere safe.</p><button class="btn" id="export">Download backup</button></div><div class="card"><h2>Import backup</h2><p class="muted">Restore a previous export. This replaces current local entries.</p><input type="file" id="import" accept=".json,application/json"></div></div><div class="card" style="margin-top:14px"><h2>Privacy</h2><p>Your changes are stored in this browser’s local storage, not a server. They do not sync across devices. The GitHub repo includes starter universities and public academic data only. Do not type passwords, national ID, private recommendation letters or other secrets.</p><button class="btn danger" id="reset">Reset local data</button></div>'}}
function navigate(p){page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('title').textContent=({home:'Your next steps',universities:'University applications',deadlines:'Deadline countdown',requirements:'Submission checklists',writing:'SOP & personal statement planner',profile:'Reusable application details',settings:'Your data & backups'})[p];document.getElementById('subtitle').textContent=({home:'One step at a time.',universities:'Every major, requirement and portal in one place.',deadlines:'See what is urgent before it surprises you.',requirements:'Everything submitted — and everything still missing.',writing:'Think first. Write when you are ready.',profile:'No more filling in the same details repeatedly.',settings:'Keep your progress safe.'})[p];render()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>navigate(x.dataset.page));
const form=document.getElementById('form'),dlg=document.getElementById('editor');function edit(id){const u=data.unis.find(x=>x.id===id)||{id:'new-'+Date.now(),status:'considering',verified:'no',name:'',program:'',track:'',priority:'',deadline:'',fee:'',english:'',tests:'',url:'',portal:'',notes:'',done:[]};form.reset();for(const el of form.elements){if(el.name)el.value=u[el.name]||''}form.dataset.current=u.id;dlg.showModal()}document.getElementById('add').onclick=()=>edit();document.getElementById('close').onclick=()=>dlg.close();
form.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(form));const old=data.unis.find(u=>u.id===x.id);x.done=old?.done||[];if(old)Object.assign(old,x);else data.unis.push(x);save();dlg.close();render()};
document.getElementById('delete').onclick=()=>{const id=form.elements.namedItem('id').value;if(confirm('Delete this university?')){data.unis=data.unis.filter(u=>u.id!==id);save();dlg.close();render()}};
document.addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed)edit(ed.dataset.edit);const cp=e.target.closest('[data-copy]');if(cp)copy(data.profile[cp.dataset.copy]);const ch=e.target.closest('[data-key]');if(ch){const k=ch.dataset.key,v=prompt('Edit '+k,data.profile[k]);if(v!==null){data.profile[k]=v;save();render()}}if(e.target.id==='copyall')copy(Object.entries(data.profile).map(([k,v])=>k+': '+v).join('\n'));if(e.target.id==='copywriting')copy(Object.entries(data.writing).map(([k,v])=>k+': '+v).join('\n'));if(e.target.id==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='myuni-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}if(e.target.id==='reset'&&confirm('Delete all locally saved edits? Export a backup first.')){localStorage.removeItem(KEY);location.reload()}});
document.addEventListener('change',e=>{if(e.target.dataset.uid){const u=data.unis.find(u=>u.id===e.target.dataset.uid),i=+e.target.dataset.t;u.done=e.target.checked?[...new Set([...u.done,i])]:u.done.filter(v=>v!==i);save();render()}if(e.target.id==='status'){status=e.target.value;render()}if(e.target.id==='import'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!Array.isArray(imported.unis)||!imported.profile)throw Error('Incorrect backup format');if(confirm('Replace your current data?')){data=imported;save();render()}}catch(err){alert('Backup not valid: '+err.message)}};r.readAsText(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.dataset.write){data.writing[e.target.dataset.write]=e.target.value;save()}if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}});
async function copy(s){try{await navigator.clipboard.writeText(String(s));}catch{const t=document.createElement('textarea');t.value=String(s);document.body.append(t);t.select();document.execCommand('copy');t.remove()}}
render();</script>

const tabs=[['workspace','✍ Application workspace'],['eligibility','◈ Eligibility & budget'],['documents','▣ Document library'],['decisions','◇ Major decision hub'],['activity','↗ Timeline']];
const anchor=document.querySelector('[data-page="settings"]');
tabs.forEach(([id,label])=>{let b=document.createElement('button');b.className='nav';b.dataset.page=id;b.textContent=label;anchor.before(b);b.onclick=()=>navigate(id)});
const origRender=render;const origUniCard=uniCard;
let selected=data.unis[0]?.id||'',taskFilter='all';
function ensure(){if(!data.extra)data.extra={};const e=data.extra;e.workspaces??={};e.eligibility??={};e.budget??={};e.documents??={};e.events??=[];e.decisions??={};e.masterDrafts??={sop:'',personal:''};e.budgetLimit??='';return e}
const extras=()=>ensure();const item=()=>data.unis.find(u=>u.id===selected)||data.unis[0];
function details(u){const x=extras();x.workspaces[u.id]??={sop:'',personal:'',why:'',next:'',promptSop:'',promptPersonal:'',sopLimit:'1000',psLimit:'',notes:''};x.eligibility[u.id]??={gpa:'unknown',english:'unknown',prereqs:'unknown',international:'unknown',funding:'unknown',source:'',checked:''};x.budget[u.id]??={fee:'',evaluation:'',tests:'',other:'',paid:'0'};return {w:x.workspaces[u.id],e:x.eligibility[u.id],b:x.budget[u.id]}}
const choose=()=>'<select class="tabselect" id="uniChoice">'+data.unis.map(u=>'<option value="'+escapeHTML(u.id)+'" '+(u.id===item()?.id?'selected':'')+'>'+escapeHTML(u.name+' — '+u.program)+'</option>').join('')+'</select>';
const wc=t=>String(t||'').trim()?String(t).trim().split(/\s+/).length:0;
const usd=n=>Number(n||0);
const statusTag=s=>'<span class="mini-tag '+(s==='verified'?'good':s==='blocked'?'bad':'warn')+'">'+escapeHTML(s)+'</span>';
function readiness(u){const r=details(u).e,flags=['gpa','english','prereqs','international'];const checks=taskNames.filter((t,i)=>i!==6&&i!==9&&i!==12).map(t=>taskNames.indexOf(t));const n=checks.filter(i=>u.done.includes(i)).length;const blocked=flags.filter(k=>r[k]==='blocked');return {n,total:checks.length,blocked,open:flags.filter(k=>r[k]==='unknown'),score:Math.round(n/checks.length*100)}}
function upcoming(){let arr=[];for(let u of data.unis.filter(x=>!['closed','admitted'].includes(x.status))){const r=readiness(u);if(u.verified!=='yes')arr.push({u,weight:days(next(u).date)??300,msg:'Verify the official deadline for '+u.name});if(r.blocked.length)arr.push({u,weight:-10,msg:'Resolve eligibility blocker ('+r.blocked.join(', ')+') — '+u.name});else if(r.open.length)arr.push({u,weight:5+(days(next(u).date)??90)/100,msg:'Check '+r.open[0]+' eligibility — '+u.name});if(u.status==='inprogress'&&!u.done.includes(5))arr.push({u,weight:9+(days(next(u).date)??90)/100,msg:'Draft program-specific SOP — '+u.name})}return arr.sort((a,b)=>a.weight-b.weight).slice(0,3)}
function workspace(){const u=item();if(!u)return '';const {w}=details(u),r=readiness(u);return '<div class="hint"><strong>Application workspace:</strong> Each program has its own drafts and prompt. Nothing here is automatically sent to admissions.</div>'+choose()+'<div class="grid"><div class="card"><h2>'+escapeHTML(u.name)+'</h2><p>'+escapeHTML(u.program)+'</p><div class="top-actions"><span class="mini-tag">'+r.score+'% essential checklist</span>'+statusTag(u.verified==='yes'?'verified':'unknown')+'</div><div class="muted">Deadline: '+escapeHTML(next(u).date||'unknown')+' · '+countdown(u)+'</div><p class="muted small">Major: '+escapeHTML(u.track||'Undecided')+'</p><div class="top-actions">'+(u.portal?'<a href="'+escapeHTML(u.portal)+'" target="_blank" rel="noopener" class="btn secondary sm">Application portal ↗</a>':'')+(u.url?'<a href="'+escapeHTML(u.url)+'" target="_blank" rel="noopener" class="btn secondary sm">Requirements ↗</a>':'')+'</div><button class="btn secondary sm" data-edit="'+escapeHTML(u.id)+'">Edit program details</button></div><div class="card"><h2>Next actions</h2><label>What will I do next?</label><textarea data-work="next">'+escapeHTML(w.next)+'</textarea><label>Notes / open questions</label><textarea data-work="notes">'+escapeHTML(w.notes)+'</textarea></div></div><div class="two-col section"><div class="card"><h2>Statement of Purpose</h2><label>Official prompt / requirements</label><textarea data-work="promptSop">'+escapeHTML(w.promptSop)+'</textarea><label>Word limit</label><input type="number" min="0" data-work="sopLimit" value="'+escapeHTML(w.sopLimit)+'"><label>Draft — unique to this university</label><textarea class="widearea" data-work="sop">'+escapeHTML(w.sop)+'</textarea><p class="muted small"><span id="sopcount">'+wc(w.sop)+'</span> words</p><button class="btn sm" data-copywork="sop">Copy SOP</button></div><div class="card"><h2>Personal Statement</h2><label>Prompt / one question only, when required</label><textarea data-work="promptPersonal">'+escapeHTML(w.promptPersonal)+'</textarea><label>Word limit (leave blank when page-based)</label><input type="number" min="0" data-work="psLimit" value="'+escapeHTML(w.psLimit)+'"><label>Draft</label><textarea class="widearea" data-work="personal">'+escapeHTML(w.personal)+'</textarea><p class="muted small"><span id="pscount">'+wc(w.personal)+'</span> words</p><button class="btn sm" data-copywork="personal">Copy personal statement</button></div></div><div class="card"><h2>Why this program?</h2><textarea data-work="why" placeholder="Specific professors, research track, courses and why they fit my work...">'+escapeHTML(w.why)+'</textarea></div>'}
const fields=['gpa','english','prereqs','international','funding'];const label={gpa:'GPA / degree eligibility',english:'English waiver or test',prereqs:'Required coursework',international:'International applicant eligibility',funding:'Funding availability'};
function verify(){const u=item();if(!u)return '';const {e,b}=details(u);const risk=fields.slice(0,4).some(k=>e[k]!=='verified');let total=data.unis.reduce((n,z)=>{const b=details(z).b;return n+usd(b.paid)},0);return '<div class="hint">Verify requirements with a dated official source. <strong>Unknown does not mean eligible.</strong> Paid application + unresolved eligibility = review before paying.</div><div class="stats"><div class="card">Recorded spending<strong>+total.toFixed(2)+'</strong></div><div class="card">Applications tracked<strong>'+data.unis.length+'</strong></div><div class="card">Eligibility flags<strong>'+data.unis.filter(z=>fields.slice(0,4).some(k=>details(z).e[k]!=='verified')).length+'</strong></div><div class="card">Budget limit (USD)<input type="number" min="0" id="budgetLimit" value="'+escapeHTML(extras().budgetLimit)+'" placeholder="Optional"></div></div>'+choose()+'<div class="grid"><div class="card"><h2>Eligibility checks</h2>'+fields.map(k=>'<div class="entry"><label>'+label[k]+'</label><select data-elig="'+k+'">'+['unknown','verified','blocked','not applicable'].map(v=>'<option value="'+v+'" '+(e[k]===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>').join('')+'<label>Official evidence URL</label><input data-elig="source" type="url" value="'+escapeHTML(e.source)+'" placeholder="https://..."><label>Date checked</label><input data-elig="checked" type="date" value="'+escapeHTML(e.checked)+'"></div><div class="card"><h2>Financial risk</h2>'+(risk?'<p class="mini-tag warn">⚠ Verify unresolved eligibility before non-refundable spending</p>':'<p class="mini-tag good">Eligibility checks resolved; review evidence before paying</p>')+['fee','evaluation','tests','other','paid'].map(k=>'<div style="margin:12px 0"><label>'+({fee:'Application fee (USD)',evaluation:'Credential evaluation estimate (USD)',tests:'Testing estimate (USD)',other:'Other anticipated expenses (USD)',paid:'Actually paid (USD)'}[k])+'</label><input type="number" step="0.01" min="0" data-budget="'+k+'" value="'+escapeHTML(b[k])+'"></div>').join('')+'<p class="muted small">Estimated cost for this program: +(usd(b.fee)+usd(b.evaluation)+usd(b.tests)+usd(b.other)).toFixed(2)+'</p></div></div>'}
function documentView(){const e=extras();let defaultDocs=['Academic CV','Transcript','Degree Certificate','Medium of Instruction','Master SOP','Personal Statement','SmartReviewer Sample','Reference contacts','Credential Evaluation'];defaultDocs.forEach(k=>e.documents[k]??={ready:false,note:''});return '<div class="hint">This tracks your real files; it does not upload or store documents. Keep private documents on your computer. Use a consistent filename and note the current version.</div><div class="card"><h2>Reusable documents</h2>'+Object.entries(e.documents).map(([k,x])=>'<div class="entry"><div class="row"><label><input style="width:18px" type="checkbox" data-doc="'+escapeHTML(k)+'" '+(x.ready?'checked':'')+'> '+escapeHTML(k)+'</label><button class="btn secondary sm" data-deldoc="'+escapeHTML(k)+'">Remove</button></div><input placeholder="Filename / version / where it is saved..." data-docnote="'+escapeHTML(k)+'" value="'+escapeHTML(x.note)+'"></div>').join('')+'<div class="top-actions"><input id="newDoc" placeholder="New document type"><button class="btn sm" id="addDoc">Add document</button></div></div>'}
const majors=[['Computer Science','Broad systems, algorithms and AI options','Versatility; course-based or research-based routes'],['Artificial Intelligence','Intelligent agents, language, learning and reasoning','Closer to your AI application projects'],['Data Science','Statistics, inference, pipelines, applied ML','Check math prerequisites carefully'],['Software Engineering','Design, build, test, scale and ship software','Strong fit with full-stack experience'],['Human–AI Interaction / HCI','Usability, behavior, accessibility and adaptive systems','Connects KACST and GestureSign']];
function decisionView(){const d=extras().decisions;return '<div class="hint">Exploring a major does not lock you into a thesis topic. Compare what excites you, admission prerequisites, and degree outcomes. Your choice can differ by university.</div><div class="grid">'+majors.map(([n,desc,fit])=>'<div class="card"><h2>'+n+'</h2><p>'+desc+'</p><p class="muted">'+fit+'</p><label>My interest (0–5)</label><select data-major="'+escapeHTML(n)+'">'+[0,1,2,3,4,5].map(v=>'<option value="'+v+'" '+(Number(d[n]||0)===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>').join('')+'</div><div class="card section"><h2>My current preference</h2><p id="favorite"></p><p class="muted small">These are your own interest ratings, not estimated admission chances.</p></div>'}
function activityView(){const e=extras();return '<div class="hint">Record what actually happened: applications sent, replies, waiver decisions, interview invitations and recommendations. This timeline is manual, not connected to university portals.</div><div class="card"><h2>Add an event</h2><form id="eventform" class="form"><div><label>University</label><select name="university">'+data.unis.map(u=>'<option value="'+escapeHTML(u.id)+'">'+escapeHTML(u.name)+'</option>').join('')+'</select></div><div><label>Date</label><input name="date" type="date" required></div><div class="full"><label>What happened?</label><input name="message" placeholder="Asked about English waiver / submitted SOP / received reply..." required></div><div><button class="btn">Add to timeline</button></div></form></div><div class="stack section">'+[...e.events].sort((a,b)=>b.date.localeCompare(a.date)).map((x,i)=>'<div class="card"><div class="row"><strong>'+escapeHTML(data.unis.find(u=>u.id===x.university)?.name||'University')+'</strong><span class="muted">'+escapeHTML(x.date)+'</span></div><p>'+escapeHTML(x.message)+'</p><button class="btn secondary sm" data-delevent="'+escapeHTML(x.id)+'">Delete</button></div>').join('')+'</div>'}
function draw(){if(!titles[page]){origRender();if(page==='home'){const list=upcoming(),v=document.getElementById('view');const box=document.createElement('div');box.className='card';box.style.margin='20px 0';box.innerHTML='<h2>Top 3 actions right now</h2>'+(list.length?list.map(x=>'<div class="entry">'+escapeHTML(x.msg)+' <button class="btn secondary sm" data-select="'+escapeHTML(x.u.id)+'">Open workspace →</button></div>').join(''):'<p>Nothing urgent recorded. Check upcoming deadlines.</p>');v.prepend(box)}return}document.getElementById('view').innerHTML=({workspace,eligibility:verify,documents:documentView,decisions:decisionView,activity:activityView})[page]();if(page==='decisions')updateFavorite()}
render=draw;const navigateOld=navigate;navigate=function(p){navigateOld(p);if(titles[p]){document.getElementById('title').textContent=titles[p];document.getElementById('subtitle').textContent=descr[p];draw()}};uniCard=function(u){return origUniCard(u).replace('</div></div>','<button class="btn secondary sm" data-select="'+escapeHTML(u.id)+'">Workspace</button></div></div>')};
function updateFavorite(){const arr=majors.map(x=>[x[0],Number(extras().decisions[x[0]]||0)]).sort((a,b)=>b[1]-a[1]);const el=document.getElementById('favorite');if(el)el.textContent=arr[0][1]?arr.filter(x=>x[1]===arr[0][1]).map(x=>x[0]).join(' / '):'Rate your interests to find your leading direction.'}
document.addEventListener('change',e=>{const u=item();if(e.target.id==='uniChoice'){selected=e.target.value;draw()}if(e.target.dataset.elig){details(u).e[e.target.dataset.elig]=e.target.value;save();if(e.target.dataset.elig==='gpa'||e.target.dataset.elig==='english')draw()}if(e.target.dataset.doc){extras().documents[e.target.dataset.doc].ready=e.target.checked;save()}if(e.target.dataset.major){extras().decisions[e.target.dataset.major]=e.target.value;save();updateFavorite()}});
document.addEventListener('input',e=>{const u=item();if(e.target.dataset.work){details(u).w[e.target.dataset.work]=e.target.value;save();const c=document.getElementById(e.target.dataset.work==='sop'?'sopcount':e.target.dataset.work==='personal'?'pscount':'none');if(c)c.textContent=wc(e.target.value)}if(e.target.dataset.elig){details(u).e[e.target.dataset.elig]=e.target.value;save()}if(e.target.dataset.budget){details(u).b[e.target.dataset.budget]=e.target.value;save()}if(e.target.dataset.docnote){extras().documents[e.target.dataset.docnote].note=e.target.value;save()}if(e.target.id==='budgetLimit'){extras().budgetLimit=e.target.value;save()}});
document.addEventListener('click',e=>{if(e.target.dataset.select){selected=e.target.dataset.select;navigate('workspace')}if(e.target.dataset.copywork){copy(details(item()).w[e.target.dataset.copywork]||'')}if(e.target.id==='addDoc'){const key=document.getElementById('newDoc').value.trim();if(key){extras().documents[key]??={ready:false,note:''};save();draw()}}if(e.target.dataset.deldoc&&confirm('Remove this document item?')){delete extras().documents[e.target.dataset.deldoc];save();draw()}if(e.target.dataset.delevent&&confirm('Delete this timeline event?')){extras().events=extras().events.filter(x=>x.id!==e.target.dataset.delevent);save();draw()}});
document.addEventListener('submit',e=>{if(e.target.id==='eventform'){e.preventDefault();const form=new FormData(e.target);extras().events.push({id:String(Date.now()),university:form.get('university'),date:form.get('date'),message:form.get('message')});save();draw()}});
ensure();save();draw()
})();
</script>
<style>
.resume-list{display:grid;gap:12px}.resume-item{border:1px solid #51415f;border-radius:14px;padding:17px;background:#30263a}.resume-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status-dot{font-size:12px;color:#a99db9}.estimate{color:#e7c3fb;font-weight:700}.missing{border-left:3px solid #ffb579;padding-left:12px}.finished{border-left:3px solid #8fd5ab;padding-left:12px}.task-chip{display:inline-block;margin:3px;padding:6px 8px;border-radius:8px;background:#463750;font-size:12px}.task-chip.todo{background:#574037;color:#ffdbb1}.task-chip.done{background:#28473d;color:#bff2d6}
@media(max-width:800px){.resume-columns{grid-template-columns:1fr}}
</style>
<script>
(function(){
const estimates={'jhu':'45–60%','washu':'40–55%','uchicago':'30–45%','cmu':'35–50%','columbia':'18–28%','cornell':'20–30%','zhejiang':'30–40%','paris':'25–35%','tsinghua':'18–28%','nus':'12–20%'};
const accepted={'jhu':'Estimate previously associated with JHU Data Science, not the selected CS program. Reassess.','washu':'Estimate previously associated with WashU AI Engineering; exact program currently needs confirmation.'};
const labels={inprogress:'Opened / in progress',considering:'Considering',submitted:'Submitted',admitted:'Admitted',closed:'Not applying'};
const extend=()=>{data.extra??={};data.extra.acceptance??={};data.extra.resume??={};for(const [id,value] of Object.entries(estimates)){if(data.extra.acceptance[id]===undefined)data.extra.acceptance[id]=value}return data.extra};
const record=u=>{const x=extend();x.resume[u.id]??={nextStep:'',lastOpened:'',note:''};return x.resume[u.id]};
const nav=document.createElement('button');nav.className='nav';nav.dataset.page='resume';nav.textContent='↪ Resume applications';document.querySelector('[data-page="universities"]').after(nav);
function rate(u){const value=extend().acceptance[u.id];return value?escapeHTML(value):'Not assessed'}
function work(u){return u.done||[]}
function sections(u){const done=work(u),all=taskNames.map((t,i)=>({t,i}));return {complete:all.filter(x=>done.includes(x.i)),missing:all.filter(x=>!done.includes(x.i))}}
function chips(a,css){return a.length?a.map(x=>'<span class="task-chip '+css+'">'+escapeHTML(x.t)+'</span>').join(''):'<span class="muted small">None yet</span>'}
function renderResume(){
const opened=data.unis.filter(u=>u.status==='inprogress').sort((a,b)=>(next(a).date||'9999').localeCompare(next(b).date||'9999'));
const view=document.getElementById('view');
view.innerHTML='<div class="hint"><strong>Pick up where you left off.</strong> Only applications marked “In progress” appear here. Checklists are manual; an unchecked item may be optional or not applicable. Percentages are <strong>old personal estimates, not official acceptance rates or reliable admission probabilities</strong>.</div><div class="row"><h2>Opened applications ('+opened.length+')</h2><button class="btn secondary sm" id="showallapps">View all universities</button></div><div class="resume-list">'+(opened.length?opened.map(u=>{
const {complete,missing}=sections(u),r=record(u),fee=u.fee||'Check';
return '<article class="resume-item"><div class="row"><div><h2 style="margin:0 0 5px">'+escapeHTML(u.name)+'</h2><div class="muted">'+escapeHTML(u.program)+'</div></div><div class="actions"><button class="btn" data-select="'+escapeHTML(u.id)+'">Resume →</button>'+(u.portal?'<a class="btn secondary sm" href="'+escapeHTML(u.portal)+'" target="_blank" rel="noopener noreferrer">Application portal ↗</a>':'')+'</div></div><div class="top-actions"><span class="pill">Major: '+escapeHTML(u.track||'Not chosen')+'</span><span class="pill">Due: '+escapeHTML(next(u).date||'Not verified')+'</span><span class="pill">'+countdown(u)+'</span><span class="pill">Previous estimate: <span class="estimate">'+rate(u)+'</span></span></div>'+(accepted[u.id]?'<p class="micro">⚠ '+accepted[u.id]+'</p>':'')+'<div class="bar"><span style="width:'+Math.round(complete.length/taskNames.length*100)+'%"></span></div><p class="muted small">'+complete.length+' completed · '+missing.length+' unchecked · Program checklists may contain optional items</p><div class="resume-columns"><div class="finished"><strong>✓ Marked done ('+complete.length+')</strong><div>'+chips(complete,'done')+'</div></div><div class="missing"><strong>○ Still unchecked ('+missing.length+')</strong><div>'+chips(missing,'todo')+'</div></div></div><div class="top-actions"><button class="btn secondary sm" data-checkresume="'+escapeHTML(u.id)+'">Update checklist</button><button class="btn secondary sm" data-select="'+escapeHTML(u.id)+'">Continue SOP / notes</button></div><div class="resume-columns"><div><label>Last opened (optional)</label><input type="date" data-resumefield="lastOpened" data-rid="'+escapeHTML(u.id)+'" value="'+escapeHTML(r.lastOpened)+'"></div><div><label>My next step</label><input data-resumefield="nextStep" data-rid="'+escapeHTML(u.id)+'" placeholder="e.g., Request MOI waiver" value="'+escapeHTML(r.nextStep)+'"></div></div></article>'
}).join(''):'<div class="card"><h2>No open applications</h2><p>Open Universities, edit one and set its status to “In progress” to make it appear here.</p></div>')+'</div><div class="card section"><h2>Personal estimates across all programs</h2><p class="muted small">These are the ranges from your earlier shortlist, not university acceptance statistics. They do not account reliably for applicant-specific factors or program changes. Edit them if your plan changes.</p>'+data.unis.map(u=>'<div class="copyline"><div><strong>'+escapeHTML(u.name)+'</strong><div class="micro">'+escapeHTML(u.program)+'</div></div><input style="width:135px" aria-label="Estimate for '+escapeHTML(u.name)+'" data-rate="'+escapeHTML(u.id)+'" value="'+escapeHTML(extend().acceptance[u.id]||'')+'" placeholder="Not assessed"></div>').join('')+'</div>';
}
const oldNavigate=navigate;navigate=function(p){oldNavigate(p);if(p==='resume'){document.getElementById('title').textContent='Resume your applications';document.getElementById('subtitle').textContent='Exactly what is done, what remains, and where to continue.';renderResume()}};
const oldRender=render;render=function(){if(page==='resume')renderResume();else {oldRender();if(page==='home'){const host=document.getElementById('view'),box=document.createElement('div');const opened=data.unis.filter(u=>u.status==='inprogress');box.className='card';box.style.margin='14px 0';box.innerHTML='<div class="row"><div><strong>Continue where you left off</strong><p class="muted small">'+opened.length+' opened applications. See what is done and what remains.</p></div><button class="btn" id="goResume">Resume applications →</button></div>';host.prepend(box)}}};
document.addEventListener('click',e=>{const q=e.target.dataset.checkresume;if(q){navigate('requirements');setTimeout(()=>{const el=document.querySelector('[data-uid="'+CSS.escape(q)+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},0)}if(e.target.id==='showallapps')navigate('universities');if(e.target.id==='goResume')navigate('resume')});
document.addEventListener('input',e=>{if(e.target.dataset.rate){extend().acceptance[e.target.dataset.rate]=e.target.value;save()}if(e.target.dataset.resumefield){record(data.unis.find(u=>u.id===e.target.dataset.rid))[e.target.dataset.resumefield]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset.resumefield){record(data.unis.find(u=>u.id===e.target.dataset.rid))[e.target.dataset.resumefield]=e.target.value;save()}});
extend();save();render();
})();
</script>

<script>
(function(){
const KEY='myuni-welcome-quotes-v1';
const defaultQuotes=[
"When there is desire, there's gonna be a flame.",
"One thing at a time. That is enough.",
"You are allowed to be a beginner at something new.",
"Small steps still move you forward.",
"You don't have to have it all figured out today.",
"Progress doesn't have to be loud to be real.",
"You can be uncertain and still keep going.",
"Rest is part of the journey, not a detour.",
"Your pace is still a pace.",
"Not every answer needs to arrive today.",
"Some beautiful things take longer to grow.",
"There's room for you to change your mind.",
"The next step matters more than the perfect plan.",
"You don't need to earn your right to pause.",
"You've already made it through so many unknowns.",
"A little courage counts, too.",
"Keep the wonder. Leave the pressure.",
"Your future isn't a race against anyone else's.",
"Even slow mornings can become good days.",
"You can do difficult things gently."
];
let quotes;
try{const saved=JSON.parse(localStorage.getItem(KEY));quotes=Array.isArray(saved)?saved.filter(q=>typeof q==='string'&&q.trim()).slice(0,100):[]}catch{quotes=[]}
let last=-1,showManager=false;
function pick(){const all=[...defaultQuotes,...quotes];if(all.length===1)return all[0];let i=Math.floor(Math.random()*(all.length-1));if(i>=last)i++;last=i;return all[i]}
let current=pick();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const renderBefore=render;
render=function(){
renderBefore();
if(page!=='home')return;
const view=document.getElementById('view');if(!view)return;
const panel=document.createElement('section');panel.className='zee-welcome';panel.setAttribute('aria-label','A little encouragement for Zee');
panel.innerHTML='<div class="zee-label">A little something for you</div><blockquote id="zee-quote">'+esc(current)+'</blockquote><h2 class="zee-hello">Hello, Zee ♡</h2><div class="zee-foot">You don’t have to figure out every university today. Just choose one small thing when you’re ready.</div><div class="zee-actions"><button type="button" class="zee-next" id="zee-another">↻ Another thought</button><button type="button" class="zee-edit" id="zee-customize">♡ My own quotes</button><span class="zee-note">A different thought every time you open myUni.</span></div><div id="zee-manager" '+(showManager?'':'hidden')+' class="zee-quote-manager"><label for="zee-custom-quote">Add a sentence you want to see again</label><textarea id="zee-custom-quote" maxlength="300" placeholder="Write something kind to your future self..."></textarea><div class="zee-actions"><button type="button" class="zee-next" id="zee-save-quote">Save this thought</button><span class="zee-note" id="zee-added">'+quotes.length+' personal quotes saved on this device.</span></div></div>';
view.prepend(panel);
};
document.addEventListener('click',e=>{
if(e.target.id==='zee-another'){current=pick();const q=document.getElementById('zee-quote');if(q)q.textContent=current}
if(e.target.id==='zee-customize'){showManager=!showManager;const m=document.getElementById('zee-manager');if(m)m.hidden=!showManager}
if(e.target.id==='zee-save-quote'){
const input=document.getElementById('zee-custom-quote');const value=input?.value.trim();
if(!value)return;
if(quotes.length>=100){alert('You can keep up to 100 personal thoughts here.');return}
quotes.push(value);localStorage.setItem(KEY,JSON.stringify(quotes));current=value;
document.getElementById('zee-quote').textContent=current;input.value='';document.getElementById('zee-added').textContent=quotes.length+' personal quotes saved on this device.';
}
});
render();
})();
</script>

<script id="zee-welcome-script">
(function(){
  // Personal encouragement, deliberately separate from application progress.
  const lines=[
    "When there is desire, there is going to be a flame.",
    "You don't have to see the whole staircase. Just take the next step.",
    "Little by little, a little becomes a lot.",
    "Some days, simply showing up is enough.",
    "A quiet beginning can still become something extraordinary.",
    "Not everything needs to be figured out today.",
    "You're allowed to grow at your own pace.",
    "Even the smallest step can change your direction.",
    "Your dreams are allowed to take their time.",
    "One page, one choice, one day at a time.",
    "You are becoming someone you haven't met yet.",
    "There is beauty in beginning again.",
    "A slow season is still a season of growth.",
    "You can be uncertain and still move forward.",
    "Don't confuse a difficult chapter with the whole story.",
    "Some doors open after a long walk.",
    "Let curiosity be louder than fear.",
    "Nothing blooms all year, and neither must you.",
    "It is okay to rest without giving up.",
    "You don't need all the answers to begin.",
    "The future is built in ordinary moments.",
    "Make room for the person you're becoming.",
    "Your progress doesn't have to be visible to be real.",
    "Softly, steadily, you are getting there.",
    "Courage can look like trying once more.",
    "Every great journey has an ordinary Tuesday.",
    "A small light is still a light.",
    "You are allowed to choose a new direction.",
    "There is still so much good ahead.",
    "The next chapter doesn't have to be written tonight."
  ];
  const key="myuni-zee-quote-v1",period=5*60*1000;
  let current=-1,changedAt=0;
  try{const x=JSON.parse(localStorage.getItem(key));if(Number.isInteger(x.i)&&x.i>=0&&x.i<lines.length&&Number.isFinite(x.t)){current=x.i;changedAt=x.t}}catch{}
  function choose(force=false){
    const now=Date.now();
    if(force||current<0||now-changedAt>=period){
      let n=Math.floor(Math.random()*lines.length);
      if(lines.length>1&&n===current)n=(n+1+Math.floor(Math.random()*(lines.length-1)))%lines.length;
      current=n;changedAt=now;
      try{localStorage.setItem(key,JSON.stringify({i:current,t:changedAt}))}catch{}
    }
    const q=document.getElementById("zee-quote-line");
    if(q&&q.textContent!==lines[current])q.textContent=lines[current];
  }
  function show(){
    if(typeof page==="undefined"||page!=="home")return;
    const root=document.getElementById("view");
    if(!root||root.querySelector("#zee-welcome")){choose();return}
    const welcome=document.createElement("section");
    welcome.className="zee-welcome";welcome.id="zee-welcome";
    welcome.setAttribute("aria-label","A little encouragement for Zee");
    welcome.innerHTML='<div class="zee-welcome-content"><p class="zee-quote" id="zee-quote-line" aria-live="off"></p><h2 class="zee-greeting">Hello, Zee.</h2><p class="zee-subtext">A little reminder: you can do this one step at a time.</p></div><button class="zee-next-quote" type="button" id="zee-next-quote" aria-label="Show another encouraging thought" title="Another thought">↻</button>';
    root.prepend(welcome);choose();
  }
  // Observe home navigation without altering the existing application logic.
  const observer=new MutationObserver(()=>{if(page==="home"&&!document.getElementById("zee-welcome"))show()});
  observer.observe(document.getElementById("view"),{childList:true});
  document.addEventListener("click",e=>{if(e.target.closest("#zee-next-quote"))choose(true)});
  setInterval(()=>{if(document.visibilityState!=="hidden")choose()},period);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){show();choose()}});
  show();
})();
</script>

ebkit-details-marker{display:none}.resume-details summary:after{content:"＋";font-size:18px}.resume-details[open] summary:after{content:"−"}.resume-detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.resume-detail-col{background:var(--surface2);border-radius:13px;padding:15px}.resume-detail-col h4{margin:0 0 11px;font-size:14px}.resume-bullets{list-style:none;padding:0;margin:0}.resume-bullets li{position:relative;padding:9px 0 9px 22px;font-size:13px;line-height:1.5;border-bottom:1px solid var(--line)}.resume-bullets li:last-child{border:0}.resume-bullets li:before{position:absolute;left:0;top:10px;content:"•";color:var(--accent)}.resume-bullets.done li:before{content:"✓";color:var(--success)}.resume-bullets.todo li:before{content:"○";color:var(--warning)}.resume-tiny-note{font-size:12px;color:var(--muted);line-height:1.5;margin:9px 0}.resume-controls{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 0}.resume-calm-card .btn{font-size:12px}.resume-calm .pill{font-size:11px}.resume-more-note{margin:14px 0;padding:12px;border-radius:10px;color:var(--muted);background:var(--surface2);font-size:12px;line-height:1.55}
@media(max-width:800px){.resume-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.resume-detail-cols{grid-template-columns:1fr}.resume-calm-card{padding:17px}}
</style>
<script id="resume-calm-script">
(function(){
 const ids=['jhu','washu'];
 const finished={
 jhu:['Chose Computer Science (AI interest)','Reviewed courses and background','Prepared MOI certificate request','Reviewed essay and reference requirements'],
 washu:['Started McKelvey application','Filled out academic-history guidance','Mapped prerequisite courses','Drafted KACST research-experience text']
 };
 const nextSteps={
 jhu:['Write and tailor your SOP','Check the English-waiver decision','Check recommendations and uploads'],
 washu:['Confirm your exact program','Finish the KACST research fields','Confirm English requirement']
 };
 const details={
 jhu:{done:['MSE Computer Science selected; Artificial Intelligence area of interest.','MOI certificate request drafted and sent to the university.','Academic prerequisites and employment entries discussed.','SOP, recommendations and optional personal statement requirements reviewed.'],todo:['Finish SOP (maximum 1,000 words).','Decide on optional personal statement and work sample.','Check MOI waiver approval or English test.','Check recommendation invitations and uploaded documents.','Review application and submit; save confirmation.']},
 washu:{done:['McKelvey School of Engineering application started.','Academic history and equivalent courses mapped.','KACST mentor and research experience wording drafted.','English proficiency and employment entries discussed.'],todo:['Confirm exact degree and 2027 deadline.','Fill real KACST hours/week and compensation.','Confirm English test or exemption.','Complete SOP, references and required uploads.','Submit and save confirmation.']}
 };
 function h(x){return String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]))}
 function list(a,cls){return '<ul class="resume-bullets '+cls+'">'+a.map(x=>'<li>'+h(x)+'</li>').join('')+'</ul>'}
 function renderCalm(){
  const root=document.getElementById('view');if(!root)return;
  const current=ids.map(id=>data.unis.find(u=>u.id===id)).filter(Boolean);
  root.innerHTML='<div class="resume-more-note"><strong>Just two applications.</strong> Focus on the next three steps. Open details only when you need them. “Worked on” means we discussed it here, not that the portal confirmed it.</div><div class="resume-calm">'+current.map(u=>{
   const id=u.id,checked=(u.done||[]).length,rate=data.extra?.acceptance?.[id]||({jhu:'45–60%',washu:'40–55%'}[id]),deadline=next(u).date||'TBD';
   return '<section class="resume-calm-card"><div class="resume-heading"><div><h2>'+h(u.name)+'</h2><p class="resume-major">'+h(u.program)+'</p></div><div class="resume-controls"><button class="btn" data-select="'+h(id)+'">Continue application →</button>'+(u.portal?'<a class="btn secondary" href="'+h(u.portal)+'" target="_blank" rel="noopener">Open portal ↗</a>':'')+'</div></div>'+
   '<div class="resume-status-line"><span class="resume-status pending">◷ In progress</span><span class="resume-status '+(u.verified==='yes'?'ok':'pending')+'">Deadline: '+h(deadline)+(u.verified==='yes'?'':' · Verify')+'</span><span class="resume-status">Previous estimate: '+h(rate)+'</span></div>'+
   '<div class="resume-focus"><h3>Focus on these 3 things</h3>'+nextSteps[id].map((x,i)=>'<div class="resume-focus-line"><span class="resume-focus-num">'+(i+1)+'</span><span>'+h(x)+'</span></div>').join('')+'</div>'+
   '<div class="resume-summary"><div class="resume-summary-box"><span class="micro">Already discussed</span><b style="color:var(--success)">'+finished[id].length+'</b><span class="micro">topics</span></div><div class="resume-summary-box"><span class="micro">Portal checklist</span><b>'+checked+' / '+taskNames.length+'</b><span class="micro">checked by you</span></div><div class="resume-summary-box"><span class="micro">Deadline countdown</span><b>'+countdown(u)+'</b><span class="micro">'+(u.verified==='yes'?'Date marked verified':'Needs verification')+'</span></div></div>'+
   '<details class="resume-details"><summary>Show full progress & remaining tasks</summary><div class="resume-detail-cols"><div class="resume-detail-col"><h4 style="color:var(--success)">✓ Worked on together</h4>'+list(details[id].done,'done')+'</div><div class="resume-detail-col"><h4 style="color:var(--warning)">○ Still to check or finish</h4>'+list(details[id].todo,'todo')+'</div></div><div class="resume-more-note">Previous acceptance estimate is not an official or individualized probability; estimates may refer to another major. Portal tasks are not marked complete automatically.</div><button class="btn secondary sm" data-checkresume="'+h(id)+'">Open detailed checklist →</button></details>'+
   '</section>'
  }).join('')+'</div><div class="resume-more-note">Other universities are kept under <strong>Universities</strong> until you actually start applying.</div>';
 }
 const prev=navigate;navigate=function(p){prev(p);if(p==='resume')renderCalm()};
 const navigation=document.querySelector('[data-page="resume"]');if(navigation)navigation.onclick=()=>navigate('resume');
 document.addEventListener('click',e=>{if(e.target.closest('#goResume'))setTimeout(()=>{if(page==='resume')renderCalm()},0)},true);
 if(page==='resume')renderCalm();
})();
</script>
<style id="myuni-experience-effects-style">
.vault-card{padding:19px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.vault-card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px;justify-content:space-between}
.vault-card summary::-webkit-details-marker{display:none}
.vault-card summary:after{content:"＋";font-size:22px;color:var(--accent)}
.vault-card[open] summary:after{content:"−"}
.vault-detail{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.vault-field{border-radius:11px;background:var(--surface2);padding:11px;min-width:0}
.vault-field .micro{display:block;margin-bottom:5px}.vault-field strong{overflow-wrap:anywhere}
.vault-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vault-section{display:grid;gap:13px}
.vault-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.check-folds details{margin:12px 0;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface2)}
.check-folds summary{cursor:pointer;list-style:none;padding:14px 3px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.check-folds summary::-webkit-details-marker{display:none}
.check-folds summary:after{content:"＋";font-size:19px;color:var(--accent)}
.check-folds details[open] summary:after{content:"−"}
.check-folds .check{padding:12px 5px}
#myuni-weather{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.myuni-fall{position:absolute;top:-40px;opacity:.42;user-select:none;will-change:transform;animation:myuni-fall var(--duration,13s) linear infinite;animation-delay:var(--delay,0s);left:var(--left,20%);font-size:var(--size,16px);color:var(--fallcolor,#ffc8e5)}
.myuni-rain{position:absolute;top:-35px;left:var(--left,20%);width:1px;height:var(--length,22px);opacity:.28;background:var(--fallcolor,#a9bbff);transform:rotate(12deg);animation:myuni-rain var(--duration,2s) linear infinite;animation-delay:var(--delay,0s)}
@keyframes myuni-fall{0%{transform:translate3d(0,-30px,0) rotate(0deg)}50%{transform:translate3d(35px,52vh,0) rotate(175deg)}100%{transform:translate3d(-18px,110vh,0) rotate(350deg)}}
@keyframes myuni-rain{0%{transform:translate3d(0,-40px,0) rotate(12deg)}100%{transform:translate3d(-65px,110vh,0) rotate(12deg)}}
.app{position:relative;z-index:2}#myuni-weather{z-index:3}#myuni-weather .myuni-fall,#myuni-weather .myuni-rain{pointer-events:none}
.weather-controls{margin:14px 0;padding:11px 9px;border:1px solid var(--line);border-radius:13px}
.weather-controls select{padding:7px;font-size:12px}
html[data-theme="light"] .myuni-fall{opacity:.31}
@media(prefers-reduced-motion:reduce){.myuni-fall,.myuni-rain{animation:none!important;display:none!important}}
@media(max-width:760px){.vault-detail{grid-template-columns:1fr}}
</style>
<script id="myuni-experience-effects-script">
(function(){
const experiences=[
{id:"kacst",type:"Research",organization:"King Abdulaziz City for Science and Technology (KACST)",position:"Research Intern / Software & Implementation Engineer",location:"Riyadh, Saudi Arabia",start:"June 2025",end:"August 2025",supervisor:"Dr. Mohammed Alhamadi",description:"Contributed to research on real-time recognition of user interaction strategies in adaptive visual analytics dashboards. Developed interaction logging for clicking, hovering, scrolling, and navigation; participated in an experimental study with five volunteers and analyzed 40 interaction logs with 425 annotation windows.",note:"Supervisor details from research presentation. Hours/week, payment and academic credit were not confirmed."},
{id:"freelance",type:"Professional",organization:"Self-Employed (MHRSD-registered freelance practitioner)",position:"Freelance Web Developer",location:"Saudi Arabia",start:"March 2025",end:"Present",supervisor:"Not applicable — self-employed",description:"Design and develop web applications using React, Next.js, TypeScript, Supabase and PostgreSQL. Build user interfaces, application workflows and backend integrations.",note:"MHRSD issued a freelance practitioner certificate; it is not the employer."},
{id:"kkz",type:"Employment",organization:"Kristina Kidz Centre",position:"English Instructor",location:"Saudi Arabia",start:"June 2026",end:"Present",supervisor:"Not recorded",description:"English-language instruction.",note:"Avoid adding detailed duties or work hours until verified."},
{id:"iau",type:"Employment",organization:"Imam Abdulrahman Bin Faisal University — Scientific Research Agency",position:"Administrative Assistant",location:"Saudi Arabia",start:"June 2023",end:"July 2023",supervisor:"Not recorded",description:"Administrative support in the Scientific Research Agency.",note:"Exact duties and weekly hours were not confirmed."}
];
const expKey="myuni-experiences-v1";
let stored={};try{stored=JSON.parse(localStorage.getItem(expKey))||{}}catch{}
for(const exp of experiences){if(!stored[exp.id])stored[exp.id]={...exp}}
function escape(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function keep(){localStorage.setItem(expKey,JSON.stringify(stored))}
function copyText(value){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(value).catch(()=>fallback(value))}else fallback(value)}
function fallback(value){const a=document.createElement("textarea");a.value=value;document.body.append(a);a.select();document.execCommand("copy");a.remove()}
function textExp(e){return ["Organization: "+e.organization,"Position: "+e.position,"Experience Type: "+e.type,"Location: "+e.location,"Start Date: "+e.start,"End Date: "+e.end,"Supervisor: "+e.supervisor,"Description: "+e.description].join("\n")}
const nav=document.createElement("button");nav.className="nav";nav.dataset.page="experiences";nav.textContent="◈ Copy experiences";document.querySelector('[data-page="profile"]').after(nav);
function display(){
const host=document.getElementById("view");if(!host)return;
host.innerHTML='<div class="hint">Copy your experience information into admissions forms. Dates, job titles and descriptions are editable. Verify anything marked “Not recorded” before submitting. Your edits are saved in this browser.</div><div class="vault-section">'+Object.values(stored).map(e=>'<details class="vault-card"><summary><span class="vault-heading"><span>'+escape(e.position)+'</span><span class="mini-tag">'+escape(e.type)+'</span></span></summary><p class="muted">'+escape(e.organization)+'</p><div class="vault-detail">'+["organization","position","type","location","start","end","supervisor"].map(k=>'<div class="vault-field"><span class="micro">'+escape(({organization:"Organization",position:"Position",type:"Experience type",location:"Location",start:"Start date",end:"End date",supervisor:"Supervisor"}[k]))+'</span><strong>'+escape(e[k])+'</strong><div style="margin-top:7px"><button class="btn secondary sm" data-vcopy="'+escape(e.id)+'" data-vfield="'+k+'">Copy</button></div></div>').join("")+'</div><div class="vault-field"><span class="micro">Description</span><p>'+escape(e.description)+'</p><button class="btn secondary sm" data-vcopy="'+escape(e.id)+'" data-vfield="description">Copy description</button></div><p class="resume-tiny-note">'+escape(e.note||"")+'</p><div class="vault-actions"><button class="btn sm" data-vall="'+escape(e.id)+'">Copy full entry</button><button class="btn secondary sm" data-vedit="'+escape(e.id)+'">Edit experience</button></div></details>').join("")+'</div><div class="card section"><h2>Add your own experience</h2><p class="muted">You can add internships, volunteering or work experience here.</p><button class="btn" id="vault-add">+ Add experience</button></div>';
}
const oldNavigate=navigate;
navigate=function(p){oldNavigate(p);if(p==="experiences"){page=p;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===p));document.getElementById("title").textContent="Experience vault";document.getElementById("subtitle").textContent="All your roles and research experience, ready to copy.";display()}};
nav.onclick=()=>navigate("experiences");
document.addEventListener("click",e=>{
const b=e.target.closest("[data-vcopy]");if(b){copyText(stored[b.dataset.vcopy]?.[b.dataset.vfield]||"");return}
const all=e.target.closest("[data-vall]");if(all){copyText(textExp(stored[all.dataset.vall]));return}
const edit=e.target.closest("[data-vedit]");if(edit)editExperience(edit.dataset.vedit);
if(e.target.closest("#vault-add"))editExperience(null);
});
function editExperience(id){
const old=id?stored[id]:{id:"user-"+Date.now(),organization:"",position:"",type:"Professional",location:"",start:"",end:"",supervisor:"",description:"",note:""};
const fields=[["organization","Organization"],["position","Position / title"],["type","Experience type"],["location","Location"],["start","Start date"],["end","End date"],["supervisor","Supervisor / mentor"],["description","Description"],["note","Your notes"]];
const dialog=document.createElement("dialog");dialog.innerHTML='<h2>Edit experience</h2><form class="stack">'+fields.map(([k,label])=>'<div><label>'+label+'</label>'+(k==="description"||k==="note"?'<textarea name="'+k+'">'+escape(old[k])+'</textarea>':'<input name="'+k+'" value="'+escape(old[k])+'">')+'</div>').join("")+'<div class="actions"><button class="btn" type="submit">Save</button><button type="button" class="btn secondary" data-cancel>Cancel</button></div></form>';document.body.append(dialog);dialog.showModal();
dialog.querySelector("[data-cancel]").onclick=()=>{dialog.close();dialog.remove()};
dialog.querySelector("form").onsubmit=ev=>{ev.preventDefault();stored[old.id]={...old,...Object.fromEntries(new FormData(ev.target))};keep();dialog.close();dialog.remove();display()};
}
let checklistHost=document.getElementById("view");
const checklistObserver=new MutationObserver(()=>{
if(page!=="requirements")return;
const root=document.getElementById("view");
for(const card of root.querySelectorAll(".card")){
if(card.dataset.folded==="yes"||!card.querySelector(".check"))continue;
card.dataset.folded="yes";card.classList.add("check-folds");
const checks=[...card.querySelectorAll(".check")];
const groups=[{name:"Program & eligibility",indexes:[0,1,2,3]},{name:"Documents & essays",indexes:[4,5,6,7,9]},{name:"Recommendations & submission",indexes:[8,10,11,12]}];
groups.forEach((g,j)=>{
const details=document.createElement("details");
details.open=j===0;const summary=document.createElement("summary");summary.textContent=g.name;details.append(summary);
g.indexes.forEach(i=>{if(checks[i])details.append(checks[i])});card.append(details);
});
}
});
checklistObserver.observe(checklistHost,{childList:true,subtree:false});
let effects="off";try{effects=localStorage.getItem("myuni-effect")||"sakura"}catch{effects="sakura"}
const control=document.createElement("div");control.className="weather-controls";control.innerHTML='<label for="myuni-effect-control">AMBIENCE</label><select id="myuni-effect-control"><option value="sakura">🌸 Sakura petals</option><option value="rain">☂ Soft rain</option><option value="off">Off / focus mode</option></select>';const sidebar=document.querySelector(".sidebar");sidebar.insertBefore(control,sidebar.querySelector(".theme-switcher")?.nextSibling||sidebar.firstChild);const select=control.querySelector("select");
const layer=document.createElement("div");layer.id="myuni-weather";layer.setAttribute("aria-hidden","true");document.body.append(layer);
function setEffect(value){effects=value;select.value=value;localStorage.setItem("myuni-effect",value);layer.replaceChildren();if(value==="off"||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const count=value==="sakura"?18:34;for(let i=0;i<count;i++){const span=document.createElement("span");span.className=value==="sakura"?"myuni-fall":"myuni-rain";if(value==="sakura")span.textContent=Math.random()>.38?"✿":"❀";span.style.setProperty("--left",(Math.random()*100)+"%");span.style.setProperty("--duration",value==="sakura"?(11+Math.random()*12)+"s":(1.4+Math.random()*2)+"s");span.style.setProperty("--delay",(-Math.random()*22)+"s");span.style.setProperty("--size",(12+Math.random()*11)+"px");span.style.setProperty("--length",(11+Math.random()*25)+"px");span.style.setProperty("--fallcolor",value==="sakura"?"#ffb9d9":"#aac5e6");layer.append(span)}}
select.onchange=()=>setEffect(select.value);setEffect(["sakura","rain","off"].includes(effects)?effects:"sakura");
keep();
})();
</script>
<style id="myuni-contrast-background-fix">
/* Background effects belong behind every reading and interaction surface. */
html,body{min-height:100%;background:var(--page)}
body{isolation:isolate}
#myuni-weather{position:fixed!important;inset:0!important;z-index:0!important;pointer-events:none!important;overflow:hidden}
.app{position:relative!important;z-index:1!important;background:transparent!important}
.sidebar{position:relative;z-index:2;box-shadow:4px 0 24px #00000008}
.main{position:relative;z-index:2}
dialog{position:fixed;z-index:30}
#myuni-weather .myuni-fall{opacity:.18!important}
#myuni-weather .myuni-rain{opacity:.12!important}
/* Reduce monotonous blocks: light warm panels, neutral surfaces, soft section hues. */
html[data-theme="dark"]{--page:#171923;--side:#21212e;--surface:#242936;--surface2:#303647;--field:#1b2030;--line:#3b4355;--inputline:#657084;--text:#f3f2f6;--muted:#b6bfcd;--accent:#dec1ec;--accent-text:#271b30;--button2:#394053;--button2text:#f6f1fa;--navactive:#444454;--success:#9ae3c4;--warning:#f3cf90;--danger:#ffa3ad}
html[data-theme="pink"]{--page:#241f2a;--side:#322735;--surface:#302d3a;--surface2:#403745;--field:#242630;--line:#534a5e;--inputline:#817386;--text:#faf5f8;--muted:#cdc2d0;--accent:#f2bdd6;--accent-text:#3f2738;--button2:#514253;--button2text:#fff1f8;--navactive:#5e495d;--success:#a8e4c6;--warning:#f6d29b;--danger:#ffb0ba}
html[data-theme="light"]{--page:#f5f5f2;--side:#eae9ee;--surface:#ffffff;--surface2:#eef1f3;--field:#fdfdfb;--line:#d5dbe0;--inputline:#a9b2be;--text:#252b35;--muted:#647182;--accent:#745592;--accent-text:#fff;--button2:#ece7f1;--button2text:#3b3045;--navactive:#dcd8e4;--success:#227858;--warning:#996119;--danger:#ba4252}
html[data-theme] .card,html[data-theme] .resume-calm-card,html[data-theme] .vault-card{box-shadow:0 5px 20px #00000009}
html[data-theme] .card:nth-of-type(3n+2){background:color-mix(in srgb,var(--surface) 90%,#dceef2)}
html[data-theme] .card:nth-of-type(3n+3){background:color-mix(in srgb,var(--surface) 91%,#f6e1d7)}
html[data-theme] .resume-focus{background:color-mix(in srgb,var(--surface) 93%,#f1d7ac);border-color:color-mix(in srgb,var(--warning) 32%,var(--line))}
html[data-theme] .resume-summary-box:nth-child(1){background:color-mix(in srgb,var(--surface) 87%,#cde8dd)}
html[data-theme] .resume-summary-box:nth-child(2){background:color-mix(in srgb,var(--surface) 88%,#ded8ec)}
html[data-theme] .resume-summary-box:nth-child(3){background:color-mix(in srgb,var(--surface) 88%,#d8e7f4)}
html[data-theme] .resume-detail-col:first-child{background:color-mix(in srgb,var(--surface2) 90%,#bce6d7)}
html[data-theme] .resume-detail-col:last-child{background:color-mix(in srgb,var(--surface2) 90%,#f6e0b7)}

<script id="inventory-script">
(function(){
const key='myuni-inventory-v1';
const defaults=[
{id:'cv',name:'Academic CV',status:'have',note:'Existing academic CV; check final version before each upload.'},
{id:'transcript',name:'Academic Transcript',status:'have',note:'IAU undergraduate transcript available.'},
{id:'degree',name:'Graduation Certificate',status:'have',note:'BSc Computer Science degree certificate available.'},
{id:'moi',name:'Medium of Instruction (MOI)',status:'progress',note:'Requested from IAU; certificate not yet confirmed received.'},
{id:'ielts',name:'IELTS Academic',status:'missing',note:'Not taken. Target computer-delivered test in late November or early December 2026 if needed.'},
{id:'sop',name:'Master SOP',status:'missing',note:'Prepare master draft, then tailor for each university.'},
{id:'personal',name:'Personal Statement',status:'missing',note:'Prepare based on each university’s actual prompt.'},
{id:'recommendations',name:'Recommendation Letters',status:'missing',note:'Track invitations and submission separately in each university checklist.'},
{id:'sample',name:'Sample of Work',status:'progress',note:'SmartReviewer materials exist; application-ready PDF not confirmed.'}
];
let inventory;try{inventory=JSON.parse(localStorage.getItem(key))}catch{}if(!Array.isArray(inventory))inventory=defaults;for(const d of defaults)if(!inventory.some(x=>x.id===d.id))inventory.push(d);
const saveInv=()=>localStorage.setItem(key,JSON.stringify(inventory));
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const statuses={have:'✓ Have it',progress:'◷ In progress',missing:'○ Missing',na:'— Not needed'};
const nav=document.createElement('button');nav.className='nav';nav.dataset.page='inventory';nav.textContent='▣ My inventory';const target=document.querySelector('[data-page="documents"]')||document.querySelector('[data-page="profile"]');target.before(nav);
function renderInventory(){
const host=document.getElementById('view'),counts={have:0,progress:0,missing:0};for(const d of inventory)if(counts[d.status]!==undefined)counts[d.status]++;
host.innerHTML='<div class="hint"><strong>Your files, at a glance.</strong> “Have it” means the document is in your possession, not necessarily uploaded or approved by a university.</div><div class="inventory-grid"><div class="inventory-stat"><span class="micro">✓ Have</span><b style="color:var(--success)">'+counts.have+'</b></div><div class="inventory-stat"><span class="micro">◷ In progress</span><b style="color:var(--accent)">'+counts.progress+'</b></div><div class="inventory-stat"><span class="micro">○ Missing</span><b style="color:var(--warning)">'+counts.missing+'</b></div></div><div class="inventory-focus"><strong>IELTS plan:</strong> Aim for November 21–December 5, 2026 if a waiver is not confirmed. Allow extra time for results and official score transmission. This is a planning recommendation, not a booked exam.</div><h2 class="section">My documents</h2><div class="inventory-list">'+inventory.map(d=>'<div class="inventory-item"><div><div class="inventory-name">'+esc(d.name)+'</div><div class="inventory-note">'+esc(d.note||'')+'</div><button class="btn secondary sm" style="margin-top:7px" data-editinv="'+esc(d.id)+'">Edit note</button></div><select class="inventory-status '+esc(d.status)+'" data-inv="'+esc(d.id)+'">'+Object.entries(statuses).map(([k,v])=>'<option value="'+k+'" '+(d.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div>').join('')+'</div><div class="card section"><div class="row"><div><h2>Add an inventory item</h2><p class="muted small">Useful for certificates, language tests and other reusable documents.</p></div><button class="btn" id="addInventory">+ Add item</button></div></div>';
}
const previousNav=navigate;navigate=function(p){previousNav(p);if(p==='inventory'){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));document.getElementById('title').textContent='My inventory';document.getElementById('subtitle').textContent='Everything you have, what is in progress, and what is missing.';renderInventory()}};
nav.onclick=()=>navigate('inventory');
document.addEventListener('change',e=>{if(e.target.dataset.inv){const x=inventory.find(d=>d.id===e.target.dataset.inv);if(x){x.status=e.target.value;saveInv();renderInventory()}}});
document.addEventListener('click',e=>{const id=e.target.dataset.editinv;if(id){const x=inventory.find(d=>d.id===id);const v=prompt('Edit note for '+x.name,x.note||'');if(v!==null){x.note=v;saveInv();renderInventory()}}if(e.target.id==='addInventory'){const name=prompt('What do you want to track?');if(name?.trim()){inventory.push({id:'custom-'+Date.now(),name:name.trim(),status:'missing',note:''});saveInv();renderInventory()}}});
saveInv();if(page==='inventory')renderInventory();
})();
</script>

<script id="deadline-calendar-script">
(function(){
const KEY="myuni-calendar-v1",months=["January","February","March","April","May","June","July","August","September","October","November","December"];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!state||typeof state!=="object")state={year:2026,month:9,ieltsDate:"2026-11-28",ieltsBooked:false};
if(!state.ieltsDate)state.ieltsDate="2026-11-28";
const saveCal=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nav=document.createElement("button");nav.className="nav";nav.dataset.page="calendar";nav.textContent="▦ Deadline calendar";
const ref=document.querySelector('[data-page="deadlines"]');ref.after(nav);
function events(){
const arr=[];
for(const u of data.unis){
if(u.status==="closed")continue;
if(u.priority)arr.push({date:u.priority,title:u.name,description:"Priority • "+u.program,verified:u.verified==="yes",uid:u.id});
if(u.deadline)arr.push({date:u.deadline,title:u.name,description:"Final • "+u.program,verified:u.verified==="yes",uid:u.id});
}
if(state.ieltsDate)arr.push({date:state.ieltsDate,title:"IELTS Academic",description:state.ieltsBooked?"Booked test date":"Personal target — not booked",ielts:true});
return arr.sort((a,b)=>a.date.localeCompare(b.date))
}
const badge=e=>e.ielts?"ielts":e.verified?"verified":"unverified";
function cal(){
const root=document.getElementById("view");const ev=events(),month=state.month,year=state.year,mm=String(month+1).padStart(2,"0");
const day1=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();
const byDate={};for(const e of ev)(byDate[e.date]??=[]).push(e);
const days=Array.from({length:Math.ceil((day1+total)/7)*7},(_,i)=>{
const day=i-day1+1;if(day<1||day>total)return '<div class="calendar-cell blank"></div>';
const key=year+"-"+mm+"-"+String(day).padStart(2,"0"),items=byDate[key]||[],today=new Date().toLocaleDateString("en-CA")===key;
return '<div class="calendar-cell '+(today?'today':'')+'"><span class="calendar-number">'+day+'</span>'+items.map(e=>'<button class="calendar-label '+badge(e)+'" type="button" title="'+esc(e.title+": "+e.description)+'" data-event="'+(e.ielts?"ielts":esc(e.uid))+'">'+esc(e.ielts?"IELTS · Target":e.title.replace("University","").trim())+'</button>').join("")+'</div>'
}).join("");
const monthEvents=ev.filter(e=>e.date.startsWith(year+"-"+mm));
root.innerHTML='<div class="hint">A visual timeline, so you never have to remember the order of months. <strong>Green = dates marked verified, amber = dates to verify, blue = your IELTS plan.</strong> Double-check all official deadlines in the university\'s time zone.</div>'+
'<div class="calendar-quick"><div class="calendar-head"><div><h2 class="calendar-month-title">Your year, at a glance</h2><p class="calendar-month-memory">January → February → March → April → May → June → July → August → September → October → November → December</p></div><div class="calendar-controls"><button class="btn secondary sm" id="calPrevYear">← Year</button><strong>'+year+'</strong><button class="btn secondary sm" id="calNextYear">Year →</button></div></div><div class="calendar-months">'+months.map((m,i)=>'<button type="button" class="calendar-month '+(i===month?'active':'')+' '+(ev.some(e=>e.date.startsWith(year+"-"+String(i+1).padStart(2,"0")))?"has-events":"")+'" data-calmonth="'+i+'"><span>'+m.slice(0,3)+'</span><span class="dot"></span></button>').join("")+'</div></div>'+
'<div class="card"><div class="calendar-head"><h2 class="calendar-month-title">'+months[month]+' '+year+'</h2><div class="calendar-controls"><button class="btn secondary sm" id="calPrev">← Previous</button><button class="btn secondary sm" id="calToday">Today</button><button class="btn secondary sm" id="calNext">Next →</button></div></div><div class="calendar-legend"><span>Verified deadline</span><span>Needs verification</span><span>IELTS plan</span></div><div class="calendar-grid">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>'<div class="calendar-dow">'+d+'</div>').join("")+days+'</div></div>'+
'<div class="card"><div class="row"><div><h2>IELTS Academic</h2><p class="muted small">Planning target, not a university-imposed IELTS deadline.</p></div><span class="mini-tag '+(state.ieltsBooked?"good":"warn")+'">'+(state.ieltsBooked?"Booked (self-marked)":"Not booked")+'</span></div><div class="form"><div><label>My target exam date</label><input type="date" id="ieltsCalDate" value="'+esc(state.ieltsDate)+'"></div><div><label>Booking status</label><select id="ieltsBooked"><option value="no" '+(!state.ieltsBooked?"selected":"")+'>Planning only</option><option value="yes" '+(state.ieltsBooked?"selected":"")+'>Booked — I confirmed it</option></select></div></div><p class="muted small">Suggested window: November 21–December 5, 2026, subject to each university\'s English-test policy. The initial November 28 date is an editable planning placeholder.</p></div>'+
'<div class="card"><h2>Events in '+months[month]+'</h2><div class="calendar-event-list">'+(monthEvents.length?monthEvents.map(e=>'<div class="calendar-event-row"><strong>'+esc(e.date.slice(8))+' '+months[month].slice(0,3)+'</strong><div><b>'+esc(e.title)+'</b><small>'+esc(e.description)+' · '+(e.ielts?(state.ieltsBooked?"Booked":"Planning target"):(e.verified?"Marked verified":"Verify date"))+'</small></div>'+(e.ielts?'<button class="btn secondary sm" data-event="ielts">Edit IELTS</button>':'<button class="btn secondary sm" data-event="'+esc(e.uid)+'">Open university</button>')+'</div>').join(""):'<p class="muted">No dates recorded for this month.</p>')+'</div></div>';
}
const previousNavigate=navigate;navigate=function(p){previousNavigate(p);if(p==="calendar"){page=p;document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===p));document.getElementById("title").textContent="Deadline calendar";document.getElementById("subtitle").textContent="See the months in order and every important date.";cal()}};
nav.onclick=()=>navigate("calendar");
function shift(n){const d=new Date(state.year,state.month+n,1);state.year=d.getFullYear();state.month=d.getMonth();saveCal();cal()}
document.addEventListener("click",e=>{
if(page!=="calendar")return;
const b=e.target.closest("[data-calmonth]");if(b){state.month=+b.dataset.calmonth;saveCal();cal();return}
if(e.target.closest("#calPrev"))shift(-1);if(e.target.closest("#calNext"))shift(1);
if(e.target.closest("#calPrevYear")){state.year--;saveCal();cal()}
if(e.target.closest("#calNextYear")){state.year++;saveCal();cal()}
if(e.target.closest("#calToday")){const n=new Date();state.year=n.getFullYear();state.month=n.getMonth();saveCal();cal()}
const ev=e.target.closest("[data-event]");if(ev){if(ev.dataset.event==="ielts"){document.getElementById("ieltsCalDate")?.focus();document.getElementById("ieltsCalDate")?.scrollIntoView({behavior:"smooth",block:"center"})}else{selected=ev.dataset.event;navigate("workspace")}}
});
document.addEventListener("change",e=>{
if(e.target.id==="ieltsCalDate"){state.ieltsDate=e.target.value;saveCal();cal()}
if(e.target.id==="ieltsBooked"){state.ieltsBooked=e.target.value==="yes";saveCal();cal()}
});
saveCal();
})();

<script id="essay-studio-script">
(function(){
 const $=id=>document.getElementById(id);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 $('view').innerHTML='<div class="hint"><strong>One university + one program = one essay workspace.</strong> If you change the major, the new program gets its own draft. Earlier drafts are preserved. Official prompts must be copied from each admission portal; suggested topics are planning guidance, not university requirements.</div>'+
