<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>myUni — Application Studio</title><style>
:root{font:14px Inter,system-ui,sans-serif;color:#f4f0fa;background:#17131f}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#d6b6f8}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:38px;margin:6px 0}h2{font-size:24px}.muted{color:#ada4ba}.small{font-size:12px}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{background:#221b2d;padding:27px 16px;border-right:1px solid #40344f}.brand{font:32px Georgia,serif;color:#d6baf4}.brand i{color:#9bddba}.sidebar p{font-size:11px;letter-spacing:1px;color:#a99ab6;margin-bottom:30px}.nav{display:block;width:100%;background:transparent;color:#c9bdd8;border:0;text-align:left;padding:13px;border-radius:12px;margin:5px 0}.nav.active,.nav:hover{background:#463555;color:#fff}.main{padding:32px 5vw 65px;max-width:1500px;width:100%;margin:0 auto}.header,.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:2px;color:#bda0d8}.btn{display:inline-block;background:#d6b9f1;color:#24182f;border:0;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:700}.btn.secondary{background:#3c3048;color:#f5eefa;border:1px solid #5e4d6d}.btn.danger{background:#623340;color:white}.btn.sm{padding:7px 10px;font-size:12px}.card{background:#272030;border:1px solid #42364e;border-radius:18px;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:23px 0}.stats strong{font-size:27px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stack{display:grid;gap:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;background:#47394f;border-radius:50px;font-size:11px;color:#edddfa}.red{color:#ff91a3}.amber{color:#ffd08e}.green{color:#90dcbc}.gray{color:#aba2b7}.bar{height:6px;border-radius:10px;background:#43364e;overflow:hidden}.bar span{height:100%;background:#d3b0f2;display:block}.hint{background:#33293f;border-left:3px solid #d1a9e8;padding:14px 17px;border-radius:8px;line-height:1.6;margin:20px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:#c9bdd5;font-size:12px;margin-bottom:5px}input,textarea,select{background:#17121e;color:#f7f2ff;padding:10px;border:1px solid #62516f;border-radius:10px;width:100%}textarea{min-height:95px;resize:vertical}.filter{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.filter input{flex:1;min-width:190px}.check{display:flex;gap:10px;align-items:center;border-bottom:1px solid #453850;padding:8px 0}.check input{width:17px;height:17px;accent-color:#bca3e7}.check span{flex:1}.copyline{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 0;border-bottom:1px solid #41354d}.copyline strong{display:block;margin-top:5px;overflow-wrap:anywhere}.timeline{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center}.section{margin:27px 0 13px}.footer{font-size:12px;color:#958aa2;margin-top:30px}dialog{width:min(790px,95vw);max-height:90vh;overflow:auto;background:#251e2f;border:1px solid #675477;border-radius:18px;color:#f9f2ff;padding:23px}dialog::backdrop{background:#09060ec9}@media(max-width:850px){.app{display:block}.sidebar{padding:14px}.sidebar p{margin:5px 0}.nav{display:inline-block;width:auto;padding:9px;margin:3px}.main{padding:22px}.grid,.form{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.timeline{grid-template-columns:1fr auto}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">myUni<i>.</i></div><p>FALL 2027 · ADMISSION STUDIO</p><button class="nav active" data-page="home">✦ My day</button><button class="nav" data-page="universities">▤ Universities</button><button class="nav" data-page="deadlines">◷ Countdown</button><button class="nav" data-page="requirements">☑ Checklists</button><button class="nav" data-page="writing">✎ SOP planner</button><button class="nav" data-page="profile">▣ Copy my info</button><button class="nav" data-page="settings">⚙ Backups & privacy</button></aside><main class="main"><div class="header"><div><div class="eyebrow">YOUR NEXT STEP, NOT EVERYTHING AT ONCE</div><h1 id="title">Your next steps</h1><div id="subtitle" class="muted">Focus on one application at a time.</div></div><button class="btn" id="add">+ Add university</button></div><div id="view"></div><div class="footer">Planning data only: always verify program-specific requirements and deadlines before paying or submitting. No application is automatically submitted.</div></main></div>
<dialog id="editor"><div class="row"><h2>Edit university</h2><button class="btn secondary sm" id="close">Close ✕</button></div><form id="form" class="form"><input name="id" type="hidden"><div><label>University</label><input name="name" required></div><div><label>Program / major</label><input name="program" required></div><div><label>Application status</label><select name="status"><option value="considering">Considering</option><option value="inprogress">In progress</option><option value="submitted">Submitted</option><option value="admitted">Admitted</option><option value="closed">Not applying</option></select></div><div><label>Research interests / track</label><input name="track" placeholder="AI, NLP, human-AI interaction..."></div><div><label>Priority deadline</label><input type="date" name="priority"></div><div><label>Final deadline</label><input type="date" name="deadline"></div><div><label>Official deadline checked?</label><select name="verified"><option value="no">No — verify it</option><option value="yes">Yes — verified</option></select></div><div><label>Application fee</label><input name="fee" placeholder="Free, $75, TBD..."></div><div><label>English requirement</label><input name="english"></div><div><label>Other tests</label><input name="tests" placeholder="GRE waived / unknown"></div><div><label>Program page URL</label><input type="url" name="url"></div><div><label>Application portal URL</label><input type="url" name="portal"></div><div class="full"><label>Notes — prerequisites, funding, faculty, what to check</label><textarea name="notes" rows="4"></textarea></div><div class="full actions"><button class="btn" type="submit">Save changes</button><button class="btn danger" type="button" id="delete">Delete this university</button></div></form></dialog>
<script>
const KEY='myuni-v1',taskNames=['Confirm chosen major','Verify deadline & eligibility','Check fee and funding','Confirm English requirement','Academic CV ready','SOP tailored to this program','Personal statement (if required)','Transcript uploaded','Recommenders invited / letters received','Sample of work (if required)','Review every field','Application submitted','Fee paid or waived'];
const initial=[
{id:'jhu',name:'Johns Hopkins University',program:'MSE Computer Science',status:'inprogress',track:'Artificial Intelligence / NLP',deadline:'2027-02-15',priority:'',verified:'yes',fee:'Free',english:'MOI waiver requested; NOT approved yet',tests:'GRE not required',url:'https://www.cs.jhu.edu/academic-programs/graduate-studies/masters-computer-science/',portal:'https://applygrad.jhu.edu/apply/',notes:'CS application in progress. Two recommendation letters. SOP ≤1,000 words. Personal statement optional (one-page). Sample of work optional. Data Science is a different program with a different deadline.',done:[]},
{id:'washu',name:'Washington University in St. Louis',program:'McKelvey Engineering — confirm exact program',status:'inprogress',track:'AI / Computer Science',deadline:'2027-03-01',priority:'2026-12-31',verified:'no',fee:'$75; check waiver opportunities',english:'Test required unless exemption confirmed',tests:'Check selected program',url:'https://engineering.washu.edu/academics/graduate-admissions/deadlines.html',portal:'https://gradadmit.wustl.edu/apply/',notes:'Already started application. Deadlines are unverified planning placeholders — confirm by exact program. KACST supervisor Dr. Mohammed Alhamadi.',done:[]},
{id:'uchicago',name:'University of Chicago',program:'MS Applied Artificial Intelligence',status:'considering',track:'Applied AI',deadline:'2027-01-26',priority:'2026-11-09',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://datascience.uchicago.edu/',portal:'',notes:'Recommended application. Verify both dates and requirements.',done:[]},
{id:'cmu',name:'Carnegie Mellon University',program:'Master of Software Engineering',status:'considering',track:'Software Engineering / AI',deadline:'2026-12-09',priority:'',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://mse.s3d.cmu.edu/',portal:'',notes:'Do not confuse MSE with MSAII or MSCS. Verify exact cohort and requirements.',done:[]},
{id:'columbia',name:'Columbia University',program:'MS Computer Science',status:'considering',track:'ML / NLP',deadline:'2027-02-15',priority:'2027-01-15',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://www.cs.columbia.edu/education/ms/',portal:'',notes:'More competitive option; verify funding and requirements.',done:[]},
{id:'cornell',name:'Cornell University',program:'MEng Computer Science',status:'considering',track:'Software / AI',deadline:'2027-02-01',priority:'',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://www.cs.cornell.edu/masters/meng',portal:'',notes:'Deadline unverified. Confirm campus and program.',done:[]},
{id:'zhejiang',name:'Zhejiang University',program:'International Master of Data Science',status:'considering',track:'Data Science',deadline:'',priority:'',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://www.zju.edu.cn/english/',portal:'',notes:'Find international 2027 deadline, scholarship and test rules.',done:[]},
{id:'paris',name:'Université Paris-Saclay',program:'M1 Artificial Intelligence',status:'considering',track:'AI / ML',deadline:'',priority:'',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://www.universite-paris-saclay.fr/en',portal:'',notes:'Check international applicant pathway and prerequisites.',done:[]},
{id:'tsinghua',name:'Tsinghua University',program:'AI / Data Science — confirm SIGS program',status:'considering',track:'AI',deadline:'',priority:'',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://www.sigs.tsinghua.edu.cn/en/',portal:'',notes:'Verify program language and intake.',done:[]},
{id:'nus',name:'National University of Singapore',program:'Master of Computing — AI',status:'considering',track:'AI',deadline:'2027-01-31',priority:'',verified:'no',fee:'Check',english:'Check',tests:'Check',url:'https://www.comp.nus.edu.sg/',portal:'',notes:'Verify application period and test requirements.',done:[]}
];
const basics={'Full name':'Zenab Nader Alkhater','University':'Imam Abdulrahman Bin Faisal University','Campus city':'Jubail','Region':'Eastern Province','Country':'Saudi Arabia','Degree':'Bachelor of Science in Computer Science','Field of study':'Computer Science','Attended from':'2021-08-22','Attended to':'2026-06','Overall GPA':'4.06','GPA scale':'5.00','Major GPA':'Not separately reported','Native language':'Arabic','Language of instruction':'English','Research mentor':'Dr. Mohammed Alhamadi'};
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.unis))data={unis:initial,profile:basics,writing:{interest:'Artificial Intelligence, Natural Language Processing, Human–AI Interaction',goals:'',kacst:'',smartreviewer:'',story:'',why:''}};data.profile={...basics,...data.profile};data.writing=data.writing||{};for(const u of data.unis)u.done=u.done||[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date();today.setHours(0,0,0,0);
const days=s=>s?Math.ceil((new Date(s+'T00:00:00')-today)/86400000):null;
const next=u=>u.priority&&days(u.priority)>=0?{date:u.priority,type:'Priority'}:{date:u.deadline,type:'Final'};
const countdown=u=>{let n=days(next(u).date);return n===null?'<span class="gray">Date TBD</span>':n<0?'<span class="red">Passed</span>':n<=14?'<span class="red">'+n+' days left</span>':n<=45?'<span class="amber">'+n+' days left</span>':'<span class="green">'+n+' days left</span>'};
const sorted=()=>[...data.unis].sort((a,b)=>(next(a).date||'9999').localeCompare(next(b).date||'9999'));
const progress=u=>Math.round(u.done.length/taskNames.length*100);
let page='home',search='',status='all';
function uniCard(u){return '<div class="card stack"><div class="row"><h3>'+escapeHTML(u.name)+'</h3><span class="pill">'+escapeHTML(u.status)+'</span></div><div class="muted">'+escapeHTML(u.program)+'</div><div><span class="pill">'+escapeHTML(u.track||'Major undecided')+'</span> <span class="pill">'+(u.verified==='yes'?'✓ Date verified':'⚠ Verify dates')+'</span></div><div class="row"><span class="muted small">'+next(u).type+': '+escapeHTML(next(u).date||'Unknown')+'</span><strong>'+countdown(u)+'</strong></div><div class="bar"><span style="width:'+progress(u)+'%"></span></div><div class="row"><span class="muted small">'+u.done.length+'/'+taskNames.length+' complete</span><div class="actions">'+(u.portal?'<a class="btn secondary sm" href="'+escapeHTML(u.portal)+'" rel="noopener" target="_blank">Portal ↗</a>':'')+'<button class="btn sm" data-edit="'+escapeHTML(u.id)+'">Open →</button></div></div></div>'}
function render(){const v=document.getElementById('view');let active=sorted().filter(u=>u.status==='inprogress'),up=sorted().filter(u=>!['closed','submitted','admitted'].includes(u.status)&&next(u).date&&days(next(u).date)>=0);
if(page==='home'){v.innerHTML='<div class="stats"><div class="card">Tracking<strong>'+data.unis.length+'</strong></div><div class="card">In progress<strong>'+active.length+'</strong></div><div class="card">Submitted<strong>'+data.unis.filter(u=>u.status==='submitted').length+'</strong></div><div class="card">Considering<strong>'+data.unis.filter(u=>u.status==='considering').length+'</strong></div></div><div class="hint"><strong>Your next step:</strong> '+(up.length?'Review '+escapeHTML(up[0].name)+' ('+escapeHTML(up[0].program)+'), '+escapeHTML(next(up[0]).type.toLowerCase())+' date '+escapeHTML(next(up[0]).date)+'.':'Set the next deadline.')+' <br><span class="muted small">Tip: choose majors first, then tailor SOPs. Dates labeled unverified are provisional.</span></div><h2 class="section">Next on the calendar</h2><div class="grid">'+up.slice(0,4).map(uniCard).join('')+'</div><h2 class="section">Applications you started</h2><div class="grid">'+active.map(uniCard).join('')+'</div>'}
if(page==='universities'){const items=sorted().filter(u=>(status==='all'||status===u.status)&&(u.name+' '+u.program+' '+u.track).toLowerCase().includes(search.toLowerCase()));v.innerHTML='<div class="filter"><input id="search" placeholder="Find university or major..." value="'+escapeHTML(search)+'"><select id="status"><option value="all">All statuses</option>'+['inprogress','considering','submitted','admitted','closed'].map(s=>'<option '+(status===s?'selected':'')+' value="'+s+'">'+s+'</option>').join('')+'</select></div><div class="grid">'+items.map(uniCard).join('')+'</div>'}
if(page==='deadlines'){v.innerHTML='<div class="hint">🟥 14 days or fewer · 🟨 15–45 days · 🟩 more than 45 days. Unverified dates are provisional and must be checked on the program’s official page. Time zone may differ.</div><div class="stack">'+sorted().map(u=>'<div class="card timeline"><div><strong>'+escapeHTML(next(u).date||'TBD')+'</strong><div class="muted small">'+next(u).type+'</div></div><div><b>'+escapeHTML(u.name)+'</b><div class="muted small">'+escapeHTML(u.program)+(u.verified==='no'?' · ⚠ Unverified':'')+'</div></div><div class="row">'+countdown(u)+' <button class="btn sm" data-edit="'+escapeHTML(u.id)+'">Edit</button></div></div>').join('')+'</div>'}
if(page==='requirements'){v.innerHTML='<div class="hint">Each university has its own checklist. Don’t mark “submitted” until the university portal confirms it. Optional items are only needed if that program requires them.</div><div class="stack">'+sorted().filter(u=>u.status!=='closed').map(u=>'<div class="card"><div class="row"><div><h3>'+escapeHTML(u.name)+'</h3><div class="muted small">'+escapeHTML(u.program)+'</div></div><b>'+progress(u)+'% checked</b></div><div class="bar" style="margin:12px 0"><span style="width:'+progress(u)+'%"></span></div>'+taskNames.map((t,i)=>'<label class="check"><input type="checkbox" data-uid="'+escapeHTML(u.id)+'" data-t="'+i+'" '+(u.done.includes(i)?'checked':'')+'><span>'+escapeHTML(t)+'</span></label>').join('')+'</div>').join('')+'</div>'}
if(page==='profile'){v.innerHTML='<div class="hint">Copy your verified academic details instantly. Edit any value. Do not enter “Not reported” into mandatory numeric fields. No ID numbers or passwords are stored here.</div><div class="card"><div class="row"><h2>Your information</h2><button class="btn sm" id="copyall">Copy all</button></div>'+Object.entries(data.profile).map(([k,x])=>'<div class="copyline"><div><div class="muted small">'+escapeHTML(k)+'</div><strong>'+escapeHTML(x)+'</strong></div><div class="actions"><button class="btn secondary sm" data-copy="'+escapeHTML(k)+'">Copy</button><button class="btn secondary sm" data-key="'+escapeHTML(k)+'">Edit</button></div></div>').join('')+'</div>'}
if(page==='writing'){let fields=[['interest','Research interests — still exploring is okay'],['goals','What do I want from a master’s?'],['kacst','KACST — my specific contribution and what I learned'],['smartreviewer','SmartReviewer — my role, evidence, and technical challenges'],['story','Personal statement — a meaningful experience or community problem'],['why','Why this particular program? (customize per university)']];v.innerHTML='<div class="hint">You do not need a final thesis topic now. Start with broad directions grounded in projects you actually completed. SOP: background → evidence → interests → program fit → goals. Personal statement: authentic experience → reflection → contribution. Adapt every answer to the university prompt.</div><div class="card"><h2>Your writing scratchpad</h2><p class="muted small">Auto-saves on this device as you type.</p>'+fields.map(([k,label])=>'<div style="margin:15px 0"><label>'+escapeHTML(label)+'</label><textarea data-write="'+k+'">'+escapeHTML(data.writing[k]||'')+'</textarea></div>').join('')+'<div class="actions"><button class="btn sm" id="copywriting">Copy notes</button></div></div>'}
if(page==='settings'){v.innerHTML='<div class="grid"><div class="card"><h2>Export backup</h2><p class="muted">Download all your edits as a JSON file. Keep it private and save it somewhere safe.</p><button class="btn" id="export">Download backup</button></div><div class="card"><h2>Import backup</h2><p class="muted">Restore a previous export. This replaces current local entries.</p><input type="file" id="import" accept=".json,application/json"></div></div><div class="card" style="margin-top:14px"><h2>Privacy</h2><p>Your changes are stored in this browser’s local storage, not a server. They do not sync across devices. The GitHub repo includes starter universities and public academic data only. Do not type passwords, national ID, private recommendation letters or other secrets.</p><button class="btn danger" id="reset">Reset local data</button></div>'}}
function navigate(p){page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('title').textContent=({home:'Your next steps',universities:'University applications',deadlines:'Deadline countdown',requirements:'Submission checklists',writing:'SOP & personal statement planner',profile:'Reusable application details',settings:'Your data & backups'})[p];document.getElementById('subtitle').textContent=({home:'One step at a time.',universities:'Every major, requirement and portal in one place.',deadlines:'See what is urgent before it surprises you.',requirements:'Everything submitted — and everything still missing.',writing:'Think first. Write when you are ready.',profile:'No more filling in the same details repeatedly.',settings:'Keep your progress safe.'})[p];render()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>navigate(x.dataset.page));
const form=document.getElementById('form'),dlg=document.getElementById('editor');function edit(id){const u=data.unis.find(x=>x.id===id)||{id:'new-'+Date.now(),status:'considering',verified:'no',name:'',program:'',track:'',priority:'',deadline:'',fee:'',english:'',tests:'',url:'',portal:'',notes:'',done:[]};form.reset();for(const el of form.elements){if(el.name)el.value=u[el.name]||''}form.dataset.current=u.id;dlg.showModal()}document.getElementById('add').onclick=()=>edit();document.getElementById('close').onclick=()=>dlg.close();
form.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(form));const old=data.unis.find(u=>u.id===x.id);x.done=old?.done||[];if(old)Object.assign(old,x);else data.unis.push(x);save();dlg.close();render()};
document.getElementById('delete').onclick=()=>{const id=form.elements.namedItem('id').value;if(confirm('Delete this university?')){data.unis=data.unis.filter(u=>u.id!==id);save();dlg.close();render()}};
document.addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed)edit(ed.dataset.edit);const cp=e.target.closest('[data-copy]');if(cp)copy(data.profile[cp.dataset.copy]);const ch=e.target.closest('[data-key]');if(ch){const k=ch.dataset.key,v=prompt('Edit '+k,data.profile[k]);if(v!==null){data.profile[k]=v;save();render()}}if(e.target.id==='copyall')copy(Object.entries(data.profile).map(([k,v])=>k+': '+v).join('\n'));if(e.target.id==='copywriting')copy(Object.entries(data.writing).map(([k,v])=>k+': '+v).join('\n'));if(e.target.id==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='myuni-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}if(e.target.id==='reset'&&confirm('Delete all locally saved edits? Export a backup first.')){localStorage.removeItem(KEY);location.reload()}});
document.addEventListener('change',e=>{if(e.target.dataset.uid){const u=data.unis.find(u=>u.id===e.target.dataset.uid),i=+e.target.dataset.t;u.done=e.target.checked?[...new Set([...u.done,i])]:u.done.filter(v=>v!==i);save();render()}if(e.target.id==='status'){status=e.target.value;render()}if(e.target.id==='import'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!Array.isArray(imported.unis)||!imported.profile)throw Error('Incorrect backup format');if(confirm('Replace your current data?')){data=imported;save();render()}}catch(err){alert('Backup not valid: '+err.message)}};r.readAsText(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.dataset.write){data.writing[e.target.dataset.write]=e.target.value;save()}if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}});
async function copy(s){try{await navigator.clipboard.writeText(String(s));}catch{const t=document.createElement('textarea');t.value=String(s);document.body.append(t);t.select();document.execCommand('copy');t.remove()}}
render();</script></body></html>
