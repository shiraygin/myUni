 '<div class="essay-panel"><div class="essay-tabs"><button id="tabSOP" aria-selected="'+(doc==='sop')+'">SOP</button><button id="tabPersonal" aria-selected="'+(doc==='personal')+'">Personal Statement</button></div><div class="essay-two"><div><div class="essay-field"><label>'+label+' requirement</label><select data-essay="'+prefix+'Requirement">'+['unknown','required','optional','not required'].map(v=>'<option value="'+v+'" '+(d[prefix+'Requirement']===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="essay-field"><label>Official university prompt</label><textarea data-essay="'+prefix+'Prompt" rows="4" placeholder="Paste the exact prompt from the admissions portal...">'+esc(d[prefix+'Prompt'])+'</textarea></div></div><div><div class="essay-field"><label>Topics / points I want to cover (one per line)</label><textarea data-essay="'+prefix+'Topics" rows="5">'+esc(d[prefix+'Topics'])+'</textarea></div><div class="essay-topics">'+topics.map(t=>'<span class="essay-topic">'+esc(t)+'</span>').join('')+'</div></div></div><div class="essay-field"><label>My '+label+' draft</label><textarea class="essay-editor" data-essay="'+prefix+'" placeholder="Start writing here. This draft is unique to '+esc(u.name)+' — '+esc(u.program)+'.">'+esc(d[prefix])+'</textarea></div><div class="row"><div class="essay-pills"><span class="essay-pill"><strong id="essayWordCount">'+words+'</strong> words</span><span class="essay-pill" id="essayLimitFeedback">'+(limit?'Limit: '+limit+' words': 'No word limit recorded')+'</span><span class="essay-pill" id="essaySaved">Stored locally</span></div><div class="actions"><button class="btn secondary sm" id="copyEssay">Copy draft</button><button class="btn secondary sm" id="downloadEssay">Download .txt</button></div></div><div class="essay-field" style="max-width:260px"><label>Word limit (if provided)</label><input type="number" min="0" placeholder="Leave blank if unknown" data-essay="'+prefix+'Limit" value="'+esc(d[prefix+'Limit'])+'"></div><div class="essay-help">SOP: academic preparation → specific work → intellectual interests → why this particular program → future goals. Personal Statement: genuine experience → what it taught you → how you will contribute. Use each school’s exact prompt to decide what belongs.</div></div>';
 }
 const original=navigate;navigate=function(p){original(p);if(p==='essays'){page='essays';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('title').textContent='Essay Studio';$('subtitle').textContent='Different major, different university, different draft.';view()}};
 nav.onclick=()=>navigate('essays');
 document.addEventListener('click',async e=>{
 if(page!=='essays')return;
 if(e.target.id==='tabSOP'){doc='sop';view()}
 if(e.target.id==='tabPersonal'){doc='personal';view()}
 if(e.target.id==='essayOpenEditor'){edit(currentUni().id)}
 if(e.target.id==='saveEssayMajor'){const u=currentUni(),m=$('essayMajor').value.trim();if(m&&m!==u.program){u.program=m;save();view()}else if(!m)alert('Enter a program name first.')}
 if(e.target.id==='copyEssay'){const value=getDraft(currentUni())[doc]||'';try{await navigator.clipboard.writeText(value)}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();document.execCommand('copy');t.remove()}}
 if(e.target.id==='downloadEssay'){const u=currentUni(),text=getDraft(u)[doc]||'',b=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(u.id+'-'+u.program+'-'+doc).replace(/[^a-z0-9-]+/gi,'-')+'.txt';a.click();URL.revokeObjectURL(a.href)}
 });
 document.addEventListener('change',e=>{if(page==='essays'&&e.target.id==='essayUni'){chosen=e.target.value;view()}});

<style id="jhu-prompt-choice-style">
.jhu-choice-box{border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:16px;margin:12px 0 18px}
.jhu-choice-title{font-weight:800;margin:0 0 7px;font-size:16px}
.jhu-choice-desc{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.jhu-prompt-option{display:block;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;margin:9px 0;cursor:pointer}
.jhu-prompt-option:has(input:checked){border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.jhu-prompt-option strong{color:var(--text);display:block;margin:0 0 4px}
.jhu-prompt-option small{display:block;color:var(--muted);line-height:1.5;padding-left:23px}
.jhu-prompt-option input{width:auto;accent-color:var(--accent);margin-right:8px}
</style>
<script id="jhu-prompt-choice-script">
(function(){
const key='myuni-jhu-personal-prompt-choice';
const options=[
{title:'Option 1 — Personal background and experiences',description:'Explain how your background and life experiences have shaped you, and how you would contribute to the Johns Hopkins community.'},
{title:'Option 2 — Engineering challenge in your community',description:'Identify an engineering problem affecting your local community and discuss actions you could take to address it.'}
];
function install(){
if(typeof page==='undefined'||page!=='essays')return;
const uni=document.getElementById('essayUni');if(!uni||uni.value!=='jhu')return;
const tab=document.getElementById('tabPersonal');if(!tab||tab.getAttribute('aria-selected')!=='true')return;
const panel=document.querySelector('.essay-panel');if(!panel||panel.querySelector('#jhu-prompt-choice'))return;
const block=document.createElement('div');block.id='jhu-prompt-choice';block.className='jhu-choice-box';
let choice=localStorage.getItem(key)||'';
block.innerHTML='<p class="jhu-choice-title">Johns Hopkins · Choose ONE Personal Statement prompt</p><p class="jhu-choice-desc">These are concise summaries of the two options previously discussed—not verbatim portal text. Confirm the exact wording in your application. Maximum: one page.</p>'+
 options.map((o,i)=>'<label class="jhu-prompt-option"><strong><input type="radio" name="jhu-statement-choice" value="'+(i+1)+'" '+(choice===String(i+1)?'checked':'')+'>'+o.title+'</strong><small>'+o.description+'</small></label>').join('')+
 '<p class="jhu-choice-desc">Your Personal Statement draft remains saved separately from your SOP. Selecting a prompt does not overwrite your writing.</p>';
const anchor=panel.querySelector('.essay-two');if(anchor)panel.insertBefore(block,anchor);else panel.prepend(block);
block.addEventListener('change',event=>{if(event.target.name==='jhu-statement-choice')localStorage.setItem(key,event.target.value)});
}
const target=document.getElementById('view');if(target)new MutationObserver(()=>install()).observe(target,{childList:true});
document.addEventListener('click',()=>queueMicrotask(install));
install();
})();
</script>
<style id="essay-planning-board-style">

.essay-plan-card .essay-notes{min-height:160px}
.essay-plan-eyebrow{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);margin:12px 0 5px}

.essay-plan-choice input{width:auto;margin:2px 0 0;accent-color:var(--accent)}
@media(max-width:760px){.essay-plan-grid{grid-template-columns:1fr}}
</style>
<script id="essay-planning-board-script">
(function(){
const key='myuni-essay-studio-v1',noteKey='myuni-essay-planning-notes-v1';
let notes={};try{notes=JSON.parse(localStorage.getItem(noteKey))||{}}catch{}
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findUni=()=>data.unis.find(u=>u.id===selectedUniId)||data.unis[0];
let selectedUniId=data.unis[0]?.id;
function getDrafts(){try{return JSON.parse(localStorage.getItem(key))||{}}catch{return {}}}
function keyFor(u){return u.id+'::'+(u.program||'undecided').trim().toLowerCase()}
function all(u){const drafts=getDrafts();return drafts[keyFor(u)]||{}}
function save(){localStorage.setItem(noteKey,JSON.stringify(notes))}
function values(u){const k=keyFor(u);if(!notes[k]){const d=all(u);notes[k]={sopPrompt:d.sopPrompt||'',personalPrompt:d.personalPrompt||'',sopNotes:'',personalNotes:'',sopRequirement:d.sopRequirement||'unknown',personalRequirement:d.personalRequirement||'unknown',choice:localStorage.getItem('myuni-jhu-personal-prompt-choice')||'',sopTopics:d.sopTopics||'',personalTopics:d.personalTopics||''};save()}return notes[k]}
function render(){
const u=findUni();if(!u)return;const d=values(u);
document.getElementById('title').textContent='Essay Planning Board';document.getElementById('subtitle').textContent='Prompts and notes for each university and major.';
document.getElementById('view').innerHTML='<div class="hint"><strong>Planning only.</strong> Write your essays anywhere you like. Save the official prompts and your thoughts here; previous essay drafts are preserved in your browser and are not deleted.</div>'+
'<div class="essay-hero"><div class="essay-picker"><div><label>UNIVERSITY</label><select id="planUni">'+data.unis.map(x=>'<option value="'+safe(x.id)+'" '+(x.id===u.id?'selected':'')+'>'+safe(x.name)+'</option>').join('')+'</select></div><div><label>MAJOR / PROGRAM</label><div class="essay-program-line">'+safe(u.program||'Not selected')+'</div></div></div><p class="essay-prompt-help">To change the program, edit it in the university details. Notes are kept separately for each university + program.</p></div>'+
'<div class="essay-plan-grid">'+['sop','personal'].map(type=>{const isPersonal=type==='personal',name=isPersonal?'Personal Statement (POS)':'Statement of Purpose (SOP)';return '<section class="essay-plan-card '+type+'"><h2>'+name+'</h2><div class="essay-plan-eyebrow">IS IT REQUIRED?</div><select data-plan="'+type+'Requirement">'+['unknown','required','optional','not required'].map(o=>'<option value="'+o+'" '+(d[type+'Requirement']===o?'selected':'')+'>'+o+'</option>').join('')+'</select>'+
(isPersonal&&u.id==='jhu'?'<div class="essay-plan-eyebrow">JOHNS HOPKINS — CHOOSE ONE</div><div class="essay-plan-choice"><label><input type="radio" name="jhu-plan-choice" value="1" '+(d.choice==='1'?'checked':'')+'><span><strong>Option 1 · Personal background</strong><br>How your experiences shaped you and how you would contribute to the university community.</span></label><label><input type="radio" name="jhu-plan-choice" value="2" '+(d.choice==='2'?'checked':'')+'><span><strong>Option 2 · Community engineering challenge</strong><br>A local engineering challenge and what you could do to address it.</span></label></div><p class="essay-prompt-help">These are summaries, not verified verbatim prompts. Confirm the exact admissions wording. Personal statement: one-page limit.</p>':'')+
'<div class="essay-plan-eyebrow">OFFICIAL PROMPT / QUESTIONS</div><textarea data-plan="'+type+'Prompt" placeholder="Paste the exact university prompt here...">'+safe(d[type+'Prompt']||'')+'</textarea><p class="essay-prompt-help">Keep the official question here so you can refer to it while writing elsewhere.</p><div class="essay-plan-eyebrow">MY THOUGHTS & IDEAS</div><textarea class="essay-notes" data-plan="'+type+'Notes" placeholder="My angle, examples, stories, evidence, ideas to include, what I still need to research...">'+safe(d[type+'Notes']||'')+'</textarea><p class="essay-prompt-help">Autosaved to this browser.</p></section>'}).join('')+'</div>';
}
const original=navigate;
navigate=function(p){if(p==='essays'){original(p);page='essays';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render();return}original(p)};
document.addEventListener('change',e=>{
if(page!=='essays')return;
if(e.target.id==='planUni'){selectedUniId=e.target.value;render();return}
if(e.target.name==='jhu-plan-choice'){values(findUni()).choice=e.target.value;localStorage.setItem('myuni-jhu-personal-prompt-choice',e.target.value);save();return}
if(e.target.dataset.plan){values(findUni())[e.target.dataset.plan]=e.target.value;save()}
});
document.addEventListener('input',e=>{if(page!=='essays'||!e.target.dataset.plan)return;values(findUni())[e.target.dataset.plan]=e.target.value;save()});
const nav=document.querySelector('[data-page="essays"]');if(nav){nav.textContent='✎ Essay notes & prompts';nav.addEventListener('click',()=>setTimeout(()=>{if(page==='essays')render()},0))}
})();
</script></body></html>
